name: Build Horizon Nav

on:
  push:
    branches: [main]
    # the app's source is now saved straight into the repository; a change to any of it builds the app
    # (HorizonNav.zip still works as before, as a fallback)
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "CHANGELOG.md"
      - "HorizonNav.zip"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish the app to the download link (so the app's update check finds it)"
        type: boolean
        default: false
      send_to_play:
        description: "Send the Play version to Google Play (needs the Play access key in Secrets)"
        type: choice
        options: ["closed testing", "internal testing", "not this time"]
        default: "closed testing"

permissions:
  contents: write

# one build at a time: an upload and pressing Run workflow at once would otherwise race
concurrency:
  group: build-horizon-nav
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 0

      # The source is normally saved straight into the repository, and is built from there. If a HorizonNav.zip is uploaded
      # instead (the old way), it is unpacked, its files are saved into the repository as before, and the ZIP itself is removed,
      # so the repository doesn't grow by a whole copy of the app with every upload.
      - name: Find the app's source
        run: |
          set -euo pipefail
          ZIP="$GITHUB_WORKSPACE/HorizonNav.zip"
          if [ -f "$ZIP" ]; then
            UNPACKED="$RUNNER_TEMP/horizon-unpacked"
            rm -rf "$UNPACKED"; mkdir -p "$UNPACKED"
            unzip -q "$ZIP" -d "$UNPACKED"
            SRC="$(dirname "$(find "$UNPACKED" -name settings.gradle.kts -print -quit)")"
            [ -f "$SRC/settings.gradle.kts" ] && [ -f "$SRC/app/build.gradle.kts" ] || { echo "ERROR: HorizonNav.zip has no Android project in it"; exit 1; }
            rsync -a --delete \
              --exclude='.git/' --exclude='.github/' --exclude='/README.md' --exclude='HorizonNav.zip' --exclude='signing.keystore' \
              "$SRC/" "$GITHUB_WORKSPACE/"
            cd "$GITHUB_WORKSPACE"
            git rm -q --cached HorizonNav.zip
            rm -f HorizonNav.zip
            git add -A
            git reset -q -- README.md signing.keystore .github 2>/dev/null || true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Save Horizon Nav source from uploaded ZIP and remove the ZIP [skip ci]"
            for i in 1 2 3; do
              git fetch origin "$GITHUB_REF_NAME" && git rebase "origin/$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break
              [ "$i" = 3 ] && { echo "ERROR: could not save the source after 3 tries"; exit 1; }
              sleep 10
            done
            echo "Source from the ZIP saved to the repository."
          fi
          PROJECT_DIR="$GITHUB_WORKSPACE"
          [ -f "$PROJECT_DIR/settings.gradle.kts" ] || { echo "ERROR: settings.gradle.kts not found"; exit 1; }
          [ -f "$PROJECT_DIR/app/build.gradle.kts" ] || { echo "ERROR: Could not find the Android app module."; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Building from $PROJECT_DIR"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Accept the Android licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Restore the existing signing key from GitHub Secrets
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          [ -n "$SIGNING_KEYSTORE_BASE64" ] || { echo "Missing SIGNING_KEYSTORE_BASE64 secret"; exit 1; }
          [ -n "$SIGNING_STORE_PASSWORD" ] || { echo "Missing SIGNING_STORE_PASSWORD secret"; exit 1; }
          [ -n "$SIGNING_KEY_PASSWORD" ] || { echo "Missing SIGNING_KEY_PASSWORD secret"; exit 1; }
          [ -n "$SIGNING_KEY_ALIAS" ] || { echo "Missing SIGNING_KEY_ALIAS secret"; exit 1; }

          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.keystore"
          keytool -list -keystore "$RUNNER_TEMP/signing.keystore" \
            -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" > /dev/null
          mkdir -p ~/.android
          cp "$RUNNER_TEMP/signing.keystore" ~/.android/debug.keystore
          cp "$RUNNER_TEMP/signing.keystore" "$GITHUB_WORKSPACE/signing.keystore"
          echo "Existing signing key restored successfully."

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.4

      - name: Prepare the release notes (and put them inside the app for its What's new card)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          # Use the first version section in CHANGELOG.md.
          CHANGELOG="$PROJECT_DIR/CHANGELOG.md"
          CHANGE_NOTES="$RUNNER_TEMP/horizon-change-notes.md"
          : > "$CHANGE_NOTES"
          if [ -f "$CHANGELOG" ]; then
            awk '
              /^##[[:space:]]+/ {
                if (section_found) exit
                section_found=1
                next
              }
              section_found { print }
            ' "$CHANGELOG" > "$CHANGE_NOTES"
            # Remove leading blank lines from the extracted section.
            sed -i '/./,$!d' "$CHANGE_NOTES"
          fi

          # Leave out any notes an earlier release already published, so the changelog never has to be emptied
          # by hand. If GitHub can't be asked for the old releases, the notes are used as they are.
          PUBLISHED="$RUNNER_TEMP/published-notes.txt"
          gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate --jq '.[].body' > "$PUBLISHED" 2>/dev/null || : > "$PUBLISHED"
          python3 - "$PUBLISHED" "$CHANGE_NOTES" <<'PY'
          import re, sys
          def key(t): return re.sub(r"[^a-z0-9]+", " ", t.lower()).strip()
          bullet = re.compile(r"\s*[-*]\s+(.*)")
          old = set()
          for line in open(sys.argv[1], encoding="utf-8", errors="ignore"):
              m = bullet.match(line)
              if m: old.add(key(m.group(1)))
          lines = [l for l in open(sys.argv[2], encoding="utf-8").read().splitlines() if l.strip()]
          out, keep = [], True
          for line in lines:
              m = bullet.match(line)
              if m: keep = key(m.group(1)) not in old
              elif line[:1].isspace(): pass   # a wrapped line goes with its bullet
              else: keep = True               # a heading: tidied below
              if keep: out.append(line)
          tidy = []
          for i, line in enumerate(out):
              if not bullet.match(line) and not line[:1].isspace():
                  nxt = next((l for l in out[i + 1:] if bullet.match(l) or not l[:1].isspace()), "")
                  if not bullet.match(nxt): continue   # a heading with nothing new under it
              tidy.append(line)
          open(sys.argv[2], "w", encoding="utf-8").write("\n".join(tidy) + ("\n" if tidy else ""))
          PY
          # The app shows these itself after updating, so the What's new card works with no connection and doesn't depend on
          # GitHub's API (which only allows a few requests an hour and often turned the card blank).
          mkdir -p "$PROJECT_DIR/app/src/main/assets"
          cp "$CHANGE_NOTES" "$PROJECT_DIR/app/src/main/assets/whatsnew.md"
          echo "Notes for ${VERSION}:"; cat "$CHANGE_NOTES"

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
          # (the old key's passwords, so they don't have to be written in the app's build file)
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        # (no TomTom key is ever passed in here: the public APK must not carry one, users enter their own in Settings)
        run: gradle :app:assembleRelease

      # Key rotation: once the new key is in Secrets (made by "Make the new signing key"), the APK is signed again with both
      # keys and the rotation record. Android 9 and newer then accept it as an update and move the app to the new key; Android 8
      # still sees the old key, so it keeps updating too. Until the new key exists this step does nothing.
      # Later, setting the repository variable RETIRE_OLD_KEY to true (Settings > Secrets and variables > Actions > Variables)
      # stops phones that already have the new key from accepting anything signed only with the old one.
      - name: Sign with the new key (key rotation)
        env:
          NEW_KS_B64: ${{ secrets.NEW_SIGNING_KEYSTORE_BASE64 }}
          NEW_PW: ${{ secrets.NEW_SIGNING_PASSWORD }}
          NEW_ALIAS: ${{ secrets.NEW_SIGNING_KEY_ALIAS }}
          LINEAGE_B64: ${{ secrets.SIGNING_LINEAGE_BASE64 }}
          OLD_PW: ${{ secrets.SIGNING_STORE_PASSWORD }}
          OLD_KPW: ${{ secrets.SIGNING_KEY_PASSWORD }}
          OLD_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          RETIRE_OLD_KEY: ${{ vars.RETIRE_OLD_KEY }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$NEW_KS_B64" ]; then
            echo "No new key in Secrets yet: the APK stays signed with the existing key only."
            exit 0
          fi
          [ -n "$NEW_PW" ] && [ -n "$NEW_ALIAS" ] && [ -n "$LINEAGE_B64" ] || { echo "ERROR: the new key's secrets are incomplete."; exit 1; }
          APK="${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/HorizonNav-public.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          W="$RUNNER_TEMP/rotation"; mkdir -p "$W"
          printf '%s' "$NEW_KS_B64" | base64 --decode > "$W/new.ks"
          printf '%s' "$LINEAGE_B64" | base64 --decode > "$W/lineage.bin"
          export OLD_PW OLD_KPW NEW_PW
          if [ "$RETIRE_OLD_KEY" = "true" ]; then
            "$APKSIGNER" lineage --in "$W/lineage.bin" --out "$W/lineage-retired.bin" \
              --signer --ks "$RUNNER_TEMP/signing.keystore" --ks-key-alias "$OLD_ALIAS" --ks-pass env:OLD_PW --key-pass env:OLD_KPW \
              --set-installed-data false
            mv "$W/lineage-retired.bin" "$W/lineage.bin"
            echo "The old key is retired in this build."
          fi
          # (the old key signs for Android 8; the new key, with the rotation record, for Android 9 and newer)
          "$APKSIGNER" sign --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
            --ks "$RUNNER_TEMP/signing.keystore" --ks-key-alias "$OLD_ALIAS" --ks-pass env:OLD_PW --key-pass env:OLD_KPW \
            --next-signer --ks "$W/new.ks" --ks-key-alias "$NEW_ALIAS" --ks-pass env:NEW_PW --key-pass env:NEW_PW \
            --lineage "$W/lineage.bin" --rotation-min-sdk-version 28 \
            --out "$W/signed.apk" "$APK"
          mv "$W/signed.apk" "$APK"
          cp "$W/new.ks" "$RUNNER_TEMP/new-signing.keystore"
          rm -rf "$W"
          echo "Signed with the new key and the rotation record."

      - name: Verify APK signing certificate matches keystore
        env:
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          NEW_PW: ${{ secrets.NEW_SIGNING_PASSWORD }}
          NEW_ALIAS: ${{ secrets.NEW_SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK="${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/HorizonNav-public.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          [ -f "$APK" ] || { echo "ERROR: APK not found"; exit 1; }
          [ -n "$APKSIGNER" ] && [ -f "$APKSIGNER" ] || { echo "ERROR: apksigner not found"; exit 1; }
          fp() { sed -n 's/.*SHA-256 digest: //p' | tr -d ': ' | tr '[:upper:]' '[:lower:]'; }
          ksfp() { keytool -list -v -keystore "$1" -storepass "$2" -alias "$3" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n1 | tr -d ': ' | tr '[:upper:]' '[:lower:]'; }

          "$APKSIGNER" verify "$APK" || { echo "FAIL: Android would not accept this APK's signature."; exit 1; }
          OLD_FP="$(ksfp "$RUNNER_TEMP/signing.keystore" "$STORE_PASSWORD" "$KEY_ALIAS")"
          # what Android 8 checks (the v2 signature): must still be the old key, or those head units couldn't update
          FP8="$("$APKSIGNER" verify --print-certs --min-sdk-version 26 --max-sdk-version 27 "$APK" | fp | head -n1)"
          echo "Old key fingerprint:            $OLD_FP"
          echo "Android 8 sees:                 $FP8"
          [ -n "$OLD_FP" ] && [ "$OLD_FP" = "$FP8" ] || { echo "FAIL: Android 8 would not see the old key."; exit 1; }

          if [ -f "$RUNNER_TEMP/new-signing.keystore" ]; then
            NEW_FP="$(ksfp "$RUNNER_TEMP/new-signing.keystore" "$NEW_PW" "$NEW_ALIAS")"
            echo "New key fingerprint:            $NEW_FP"
            # the rotation record inside the APK: the old key first, then the new one
            LINEAGE="$("$APKSIGNER" lineage --in "$APK" --print-certs | fp)"
            echo "Rotation record in the APK:"; echo "$LINEAGE"
            [ "$(echo "$LINEAGE" | head -n1)" = "$OLD_FP" ] && [ "$(echo "$LINEAGE" | tail -n1)" = "$NEW_FP" ] || {
              echo "FAIL: the APK's rotation record isn't old key then new key."; exit 1; }
            # and what Android 9 and newer check
            "$APKSIGNER" verify --print-certs --min-sdk-version 28 "$APK" | grep -i 'SHA-256' || true
            rm -f "$RUNNER_TEMP/new-signing.keystore"
            echo "PASS: Android 8 sees the old key; Android 9 and newer move to the new key."
          else
            echo "PASS: The APK uses the existing signing key (no new key in Secrets yet)."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: HorizonNav-public-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish the app
        # publishing is only ever allowed from main: a build of the development branch is a test and can never reach users
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/HorizonNav-public.apk"
          CHECKSUM="HorizonNav-public.apk.sha256"
          VERSION_JSON="version.json"
          [ -f "$APK" ] || { echo "No APK was built"; exit 1; }

          BUILD="${GITHUB_RUN_NUMBER}"
          VERSION="1.0.${BUILD}"
          VERSION_CODE=$((100 + BUILD))
          TAG="v${VERSION}"

          sha256sum "$APK" | awk '{print $1}' > "$CHECKSUM"
          printf '{\n  "version": "%s",\n  "build": %s,\n  "versionCode": %s\n}\n' \
            "$VERSION" "$BUILD" "$VERSION_CODE" > "$VERSION_JSON"

          # The notes were prepared (and put inside the app) before the build: see "Prepare the release notes".
          CHANGE_NOTES="$RUNNER_TEMP/horizon-change-notes.md"

          {
            echo "## Horizon Nav ${VERSION}"
            echo
            if [ -s "$CHANGE_NOTES" ]; then
              cat "$CHANGE_NOTES"
            else
              echo "Small fixes and improvements."
            fi
            echo
            echo "### Downloads"
            echo "- **HorizonNav-public.apk** — Android app installer"
            echo "- **HorizonNav-public.apk.sha256** — SHA-256 checksum"
            echo "- **version.json** — version information used by the updater"
            echo
            echo "Built on $(date -u '+%-d %b %Y') (UTC)."
          } > release-notes.md

          # Keep a permanent, versioned release for the public history.
          # A rerun updates that same version rather than failing.
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "${{ github.repository }}" \
              --title "Horizon Nav ${VERSION}" --notes-file release-notes.md
          else
            gh release create "$TAG" "$APK" "$CHECKSUM" "$VERSION_JSON" \
              --repo "${{ github.repository }}" \
              --title "Horizon Nav ${VERSION}" --notes-file release-notes.md
          fi
          gh release upload "$TAG" "$APK" "$CHECKSUM" "$VERSION_JSON" \
            --repo "${{ github.repository }}" --clobber
          gh release view "$TAG" --repo "${{ github.repository }}" \
            --json assets --jq '.assets[].name' | tee versioned-assets.txt
          grep -Fxq "HorizonNav-public.apk" versioned-assets.txt
          grep -Fxq "HorizonNav-public.apk.sha256" versioned-assets.txt
          grep -Fxq "version.json" versioned-assets.txt

          # Also refresh the stable release URL used by the app's built-in updater.
          if gh release view app --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit app --repo "${{ github.repository }}" \
              --title "Horizon Nav (${VERSION})" --notes-file release-notes.md
          else
            gh release create app --repo "${{ github.repository }}" \
              --title "Horizon Nav (${VERSION})" --notes-file release-notes.md --latest=false
          fi
          gh release upload app "$APK" "$CHECKSUM" "$VERSION_JSON" \
            --repo "${{ github.repository }}" --clobber
          gh release view app --repo "${{ github.repository }}" \
            --json assets --jq '.assets[].name' | tee published-assets.txt
          grep -Fxq "HorizonNav-public.apk" published-assets.txt
          grep -Fxq "HorizonNav-public.apk.sha256" published-assets.txt
          grep -Fxq "version.json" published-assets.txt
          echo "Published ${VERSION} successfully."
          echo "Permanent version release: https://github.com/${{ github.repository }}/releases/tag/${TAG}"
          echo "Updater download link: https://github.com/${{ github.repository }}/releases/download/app/HorizonNav-public.apk"

      # ---- Google Play edition (com.headunit.nav.play: no self-updater, no PayPal, Play updates it) ----
      # On a manual run (sent to Play only when publishing), and after the GitHub release above, so a problem here can never hold up the normal update. Builds the
      # app bundle Play wants, signed with the existing key: Play uses that as the "upload key" and signs what it hands out with its
      # own. The bundle is kept on the run (HorizonNav-play-aab) to upload by hand; once a Play access key is in Secrets
      # (PLAY_SERVICE_ACCOUNT_JSON), it's also sent to Play's internal testing track by itself.
      - name: Build the Google Play bundle
        id: playbundle
        # the Play version is only built from main, so a development build can never be sent to Google Play
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          NEW_KS_B64: ${{ secrets.NEW_SIGNING_KEYSTORE_BASE64 }}
          NEW_PW: ${{ secrets.NEW_SIGNING_PASSWORD }}
          NEW_ALIAS: ${{ secrets.NEW_SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          gradle :app:bundlePlayRelease -PwithPlay
          AAB="$(find app/build/outputs/bundle/playRelease -name '*.aab' -print -quit)"
          [ -n "$AAB" ] || { echo "ERROR: no Play bundle was built"; exit 1; }
          mv "$AAB" app/build/outputs/bundle/playRelease/HorizonNav-play.aab
          # Google Play refuses a bundle signed with the original key (it is Android's "debug" key, CN=Android Debug), so the bundle
          # is signed again with the new key (CN=Horizon Nav), which becomes the Play upload key. The GitHub APK is not affected.
          PAAB=app/build/outputs/bundle/playRelease/HorizonNav-play.aab
          [ -n "$NEW_KS_B64" ] && [ -n "$NEW_PW" ] && [ -n "$NEW_ALIAS" ] || { echo "ERROR: the new signing key isn't in Secrets, so the Play bundle can't be signed for Google Play"; exit 1; }
          NKS="$RUNNER_TEMP/play-upload.keystore"
          (umask 077; printf '%s' "$NEW_KS_B64" | base64 --decode > "$NKS")
          trap 'rm -f "$NKS"' EXIT
          zip -q -d "$PAAB" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.EC' 'META-INF/*.DSA' 'META-INF/MANIFEST.MF' || true
          jarsigner -keystore "$NKS" -storepass:env NEW_PW -keypass:env NEW_PW -sigalg SHA256withRSA -digestalg SHA-256 "$PAAB" "$NEW_ALIAS" > /dev/null
          jarsigner -verify -verbose -certs "$PAAB" | grep -m1 "CN=" || true
          if jarsigner -verify -verbose -certs "$PAAB" | grep -q "CN=Android Debug"; then echo "ERROR: the Play bundle is still signed with the debug key"; exit 1; fi
          # Play's "What's new" for this version: the change notes as plain text, at most 500 characters
          mkdir -p "$RUNNER_TEMP/play-whatsnew"
          python3 - "$RUNNER_TEMP/play-whatsnew/whatsnew-en-GB" <<'PY'
          import os, re, sys
          p = "app/src/main/assets/whatsnew.md"
          t = open(p, encoding="utf-8").read() if os.path.isfile(p) else ""
          lines = []
          for l in t.splitlines():
              l = re.sub(r"^#+\s*", "", l).replace("**", "").strip()
              if l.startswith("- "): l = "• " + l[2:]
              if l: lines.append(l)
          out = ("\n".join(lines) or "Fixes and improvements.").replace("Horizon Nav", "Horizon Maps")
          if len(out) > 500: out = out[:497].rsplit(" ", 1)[0] + "…"
          open(sys.argv[1], "w", encoding="utf-8").write(out)
          PY

      - uses: actions/upload-artifact@v4
        if: ${{ steps.playbundle.outcome == 'success' }}
        with:
          name: HorizonNav-play-aab
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/playRelease/HorizonNav-play.aab
          if-no-files-found: warn

      - name: Is Google Play set up?
        id: play
        if: ${{ steps.playbundle.outcome == 'success' && inputs.send_to_play != 'not this time' }}
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "No Play access key in Secrets yet: download HorizonNav-play-aab from this run and upload it in Play Console."; fi

      # (Play only accepts uploads like this once the app's first version has been uploaded by hand in Play Console. Until then
      # this step fails without failing the build.)
      # closed testing is Play's "alpha" track (the one the testers group is on); internal testing is for you alone
      # The Play access key, tidied into a file the upload can read: when the key is pasted into Secrets, its private key's line
      # breaks can arrive as real line breaks instead of \n, which isn't valid JSON ("Bad control character"). Read loosely and
      # written back out properly, in the runner's temp folder only (it's deleted with the runner, and never printed).
      - name: Prepare the Play access key
        id: playkey
        if: ${{ steps.play.outputs.ready == 'true' }}
        continue-on-error: true
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          umask 077
          python3 - "$RUNNER_TEMP/play-key.json" <<'PY'
          import json, os, sys
          raw = os.environ["PLAY_JSON"].strip().lstrip("\ufeff")
          try:
              k = json.loads(raw, strict=False)
          except Exception as e:
              sys.exit("The Play access key in Secrets (PLAY_SERVICE_ACCOUNT_JSON) isn't a whole JSON key file: " + type(e).__name__)
          for f in ("type", "client_email", "private_key"):
              if not k.get(f): sys.exit("The Play access key in Secrets is missing its " + f + ": paste the whole downloaded file")
          # the private key itself: rebuilt from just its letters, in the standard 64-character lines, since a copy that was
          # wrapped, re-spaced or had its \n turned into "\\n" can't be read ("DECODER routines::unsupported")
          import re
          pk = k["private_key"].replace("\\n", "\n")
          m = re.search(r"-----BEGIN ([A-Z ]+)-----(.*?)-----END \1-----", pk, re.S)
          if not m: sys.exit("The Play access key's private_key has no BEGIN/END lines: paste the whole downloaded file")
          body = re.sub(r"[^A-Za-z0-9+/=]", "", m.group(2))
          k["private_key"] = "-----BEGIN %s-----\n%s\n-----END %s-----\n" % (m.group(1), "\n".join(body[i:i + 64] for i in range(0, len(body), 64)), m.group(1))
          open(sys.argv[1], "w").write(json.dumps(k))
          open(sys.argv[1] + ".pem", "w").write(k["private_key"])
          print("Play access key read: " + k["client_email"])
          PY
          # check the private key really opens, so a damaged copy says so plainly instead of failing inside the upload
          if ! openssl pkey -in "$RUNNER_TEMP/play-key.json.pem" -noout 2>/dev/null; then
            rm -f "$RUNNER_TEMP/play-key.json.pem"
            echo "::error::The private key inside the Play access key in Secrets is damaged (some of it was lost when it was copied). Make a new JSON key for the same service account in Google Cloud and paste the whole file into PLAY_SERVICE_ACCOUNT_JSON."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/play-key.json.pem"
          echo "The private key opens correctly."

      - name: Send to Google Play
        id: playsend
        if: ${{ steps.playkey.outcome == 'success' }}
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ runner.temp }}/play-key.json
          packageName: com.headunit.nav.play
          releaseFiles: ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/playRelease/HorizonNav-play.aab
          track: ${{ inputs.send_to_play == 'internal testing' && 'internal' || 'alpha' }}
          status: completed
          whatsNewDirectory: ${{ runner.temp }}/play-whatsnew

      # A Play app that has never been released yet only takes a release as a draft ("Only releases with status draft may be
      # created on draft app"). So if the normal upload fails, it's tried once more as a draft: it then waits in Play Console
      # (Testing > the track > Releases) for "Review release" / "Start rollout" to be pressed there.
      - name: Send to Google Play as a draft
        id: playdraft
        if: ${{ steps.playsend.outcome == 'failure' }}
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ runner.temp }}/play-key.json
          packageName: com.headunit.nav.play
          releaseFiles: ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/playRelease/HorizonNav-play.aab
          track: ${{ inputs.send_to_play == 'internal testing' && 'internal' || 'alpha' }}
          status: draft
          whatsNewDirectory: ${{ runner.temp }}/play-whatsnew

      # The Play steps above never hold up the GitHub release, but a failure there must not pass unnoticed either: the run is
      # marked failed (after everything else has finished) with a plain note of which part went wrong.
      - name: Did the Play version work?
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        run: |
          if [ "${{ steps.playbundle.outcome }}" = "failure" ]; then echo "::error::The Play version didn't build: open the 'Build the Google Play bundle' step above to see why."; exit 1; fi
          if [ "${{ steps.playkey.outcome }}" = "failure" ]; then echo "::error::The Play access key in Secrets couldn't be read: open the 'Prepare the Play access key' step above to see why."; exit 1; fi
          if [ "${{ steps.playdraft.outcome }}" = "success" ]; then echo "::warning::Sent to Google Play as a draft (this app hasn't had a release yet): in Play Console open Testing, the track, then Releases, and press Review release, then Start rollout."; exit 0; fi
          if [ "${{ steps.playsend.outcome }}" = "failure" ]; then echo "::error::The Play version built but couldn't be sent to Google Play: open the 'Send to Google Play' step above to see why."; exit 1; fi
          echo "Play version: built${{ steps.playsend.outcome == 'success' && ' and sent to Google Play' || '' }}."
