name: Build Horizon Nav
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish the app to the download link (so the app's update check finds it)"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Select source tree (prefer checkout; support archive-only repositories)
        run: |
          if [ -f settings.gradle.kts ] && [ -f app/build.gradle.kts ]; then
            PROJECT="$GITHUB_WORKSPACE"
            echo "Building directly from checked-out source tree: $PROJECT"
          else
            ZIP="HorizonNav.zip"
            if [ ! -f "$ZIP" ]; then echo "Neither a Gradle source tree nor $ZIP was found"; exit 1; fi
            unzip -t "$ZIP"
            unzip -q -o "$ZIP" -d src
            SETTINGS=$(find src -name settings.gradle.kts -type f -print -quit)
            if [ -z "$SETTINGS" ]; then echo "No settings.gradle.kts found in source archive"; exit 1; fi
            PROJECT=$(dirname "$SETTINGS")
            echo "Using source archive fallback: $PROJECT"
          fi
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Accept the Android licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Use the existing signing key (never generate or replace it automatically)
        run: |
          if [ ! -s signing.keystore ]; then
            echo "ERROR: existing signing.keystore is missing. Refusing to generate a replacement because it could prevent updates to installed apps." >&2
            exit 1
          fi
          mkdir -p ~/.android
          cp signing.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.14.4 }
      - name: Run navigation policy unit tests
        working-directory: ${{ env.PROJECT }}
        run: gradle :app:testPublicDebugUnitTest
      - name: Build release APK
        working-directory: ${{ env.PROJECT }}
        # the Mapbox download token comes from the repo's secret (only used if Mapbox asks for it)
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: gradle :app:assembleRelease -PtomtomApiKey="$TOMTOM_API_KEY"
      - name: Verify release APK and stable signing
        working-directory: ${{ env.PROJECT }}
        run: |
          APK="app/build/outputs/apk/release/HorizonNav-public.apk"
          if [ ! -s "$APK" ]; then echo "Expected release APK was not produced: $APK"; exit 1; fi
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          if [ -z "$BUILD_TOOLS" ] || [ ! -x "$BUILD_TOOLS/apksigner" ]; then echo "Android apksigner was not found"; exit 1; fi
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: HorizonNav-public-apk
          path: ${{ env.PROJECT }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      # Only when you tick "publish" on Run workflow: the APK goes to the release called "app", replacing the one there,
      # so this link always gives the newest version:
      #   https://github.com/<you>/<repo>/releases/download/app/HorizonNav-public.apk
      - name: Publish the app
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="${{ env.PROJECT }}/app/build/outputs/apk/release/HorizonNav-public.apk"
          [ -f "$APK" ] || { echo "No APK was built"; exit 1; }
          CHECKSUM="$APK.sha256"
          VERSION_JSON="${{ env.PROJECT }}/version.json"
          BUILD="${GITHUB_RUN_NUMBER}"
          VERSION="1.0.${BUILD}"
          VERSION_CODE=$((100 + BUILD))
          sha256sum "$APK" | awk '{print $1}' > "$CHECKSUM"
          printf '{\n  "version": "%s",\n  "build": %s,\n  "versionCode": %s\n}\n' "$VERSION" "$BUILD" "$VERSION_CODE" > "$VERSION_JSON"
          # Extract only the Unreleased section; never publish the changelog template.
          CHANGELOG="${{ env.PROJECT }}/CHANGELOG.md"
          CHANGELOG_NOTES=""
          if [ -s "$CHANGELOG" ]; then
            CHANGELOG_NOTES=$(awk '
              /^## Unreleased[[:space:]]*$/ { in_section=1; next }
              /^## / && in_section { exit }
              in_section { print }
            ' "$CHANGELOG" | perl -0777 -pe 's/<!--[\s\S]*?-->//g' | sed '/^[[:space:]]*$/d')
            # Reject placeholder text and incomplete template headings.
            if printf '%s' "$CHANGELOG_NOTES" | grep -qiE 'Describe a new app feature|Describe an improvement|Describe a bug fix|Add entries here before the next publish|DON CL|JON CLOS'; then
              CHANGELOG_NOTES=""
            fi
          fi
          # Leave out any notes that an earlier release already published, so nobody has to delete them from CHANGELOG.md
          # by hand (the uploaded zip never gets its changelog emptied). If GitHub can't be asked, the notes are kept as they are.
          PUBLISHED="$RUNNER_TEMP/published-notes.txt"
          gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate --jq '.[].body' > "$PUBLISHED" 2>/dev/null || : > "$PUBLISHED"
          CHANGELOG_NOTES=$(printf '%s\n' "$CHANGELOG_NOTES" | python3 -c '
          import re, sys
          def key(t): return re.sub(r"[^a-z0-9]+", " ", t.lower()).strip()
          old = set()
          for line in open(sys.argv[1], encoding="utf-8", errors="ignore"):
              m = re.match(r"\s*[-*]\s+(.*)", line)
              if m: old.add(key(m.group(1)))
          lines = sys.stdin.read().splitlines()
          out, keep = [], True
          for line in lines:
              m = re.match(r"\s*-\s+(.*)", line)
              if m: keep = key(m.group(1)) not in old
              elif line[:1].isspace() and out is not None: pass  # a wrapped bullet line goes with its bullet
              else: keep = True                                  # a heading: tidied below
              if keep: out.append(line)
          # drop headings that have no bullets left under them
          tidy = []
          for i, line in enumerate(out):
              if not re.match(r"\s*-\s", line) and not line[:1].isspace():
                  nxt = next((l for l in out[i + 1:] if re.match(r"\s*-\s", l) or not l[:1].isspace()), "")
                  if not re.match(r"\s*-\s", nxt): continue
              tidy.append(line)
          print("\n".join(tidy))
          ' "$PUBLISHED")
          if ! printf '%s\n' "$CHANGELOG_NOTES" | grep -qE '^[[:space:]]*-[[:space:]]+[^[:space:]]'; then
            # nothing new written down: publish anyway, with a general note, rather than stopping the release
            CHANGELOG_NOTES="- Small fixes and improvements."
          fi
          NOTES=$(printf 'Horizon Nav %s\n\n%s' "$VERSION" "$CHANGELOG_NOTES")
          # Publish an immutable versioned release for the What's New card, then update the stable release.
          VERSION_TAG="v${VERSION}"
          gh release create "$VERSION_TAG" --repo "${{ github.repository }}" --title "Horizon Nav ${VERSION}" --notes "$NOTES" --latest=false 2>/dev/null \
            || gh release edit "$VERSION_TAG" --repo "${{ github.repository }}" --title "Horizon Nav ${VERSION}" --notes "$NOTES"
          gh release create app --repo "${{ github.repository }}" --title "Horizon Nav (${VERSION})" --notes "$NOTES" --latest=false 2>/dev/null \
            || gh release edit app --repo "${{ github.repository }}" --title "Horizon Nav (${VERSION})" --notes "$NOTES"
          gh release upload app "$APK" "$CHECKSUM" "$VERSION_JSON" --repo "${{ github.repository }}" --clobber
          echo "Download link: https://github.com/${{ github.repository }}/releases/download/app/HorizonNav-public.apk"
