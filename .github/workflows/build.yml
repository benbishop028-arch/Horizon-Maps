name: Build Horizon Nav
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish the app to the download link (so the app's update check finds it)"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Unpack the uploaded zip
        run: |
          ZIP=$(ls *.zip | head -1)
          if [ -z "$ZIP" ]; then echo "No zip uploaded yet"; exit 1; fi
          echo "Using $ZIP"
          unzip -q -o "$ZIP" -d src
          DIR=$(dirname "$(find src -name settings.gradle.kts | head -1)")
          echo "PROJECT=$DIR" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Accept the Android licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Use the same signing key every time (so updates install over the old version)
        run: |
          if [ ! -f signing.keystore ]; then
            keytool -genkeypair -keystore signing.keystore -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add signing.keystore
            git commit -m "Add signing key"
            git push
          fi
          mkdir -p ~/.android
          cp signing.keystore ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.14.4 }
      - name: Build release APK
        working-directory: ${{ env.PROJECT }}
        # the Mapbox download token comes from the repo's secret (only used if Mapbox asks for it)
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: gradle :app:assembleRelease -PtomtomApiKey="${{ secrets.TOMTOM_API_KEY }}"
      - uses: actions/upload-artifact@v4
        with:
          name: HorizonNav-public-apk
          path: ${{ env.PROJECT }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      # Only when you tick "publish" on Run workflow: the APK goes to the release called "app", replacing the one there,
      # so this link always gives the newest version:
      #   https://github.com/<you>/<repo>/releases/download/app/HorizonNav-public.apk
     
      - name: Publish the app
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          APK="${{ env.PROJECT }}/app/build/outputs/apk/release/HorizonNav-public.apk"
          CHECKSUM="HorizonNav-public.apk.sha256"
          VERSION_JSON="version.json"

          [ -f "$APK" ] || { echo "No APK was built"; exit 1; }

          BUILD="${GITHUB_RUN_NUMBER}"
          VERSION="1.0.${BUILD}"
          VERSION_CODE=$((100 + BUILD))

          # Generate the checksum from the exact APK that will be published.
          sha256sum "$APK" | awk '{print $1}' > "$CHECKSUM"

          # Publish version information for the in-app updater.
          printf '{\n  "version": "%s",\n  "build": %s,\n  "versionCode": %s\n}\n' \
            "$VERSION" "$BUILD" "$VERSION_CODE" > "$VERSION_JSON"

          NOTES="Horizon Nav ${VERSION}, built $(date -u '+%-d %b %Y'). Download HorizonNav-public.apk below and install it over the old one."

          # Create the fixed release if it doesn't exist; otherwise update it.
          if gh release view app --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit app --repo "${{ github.repository }}" \
              --title "Horizon Nav (${VERSION})" \
              --notes "$NOTES"
          else
            gh release create app --repo "${{ github.repository }}" \
              --title "Horizon Nav (${VERSION})" \
              --notes "$NOTES" \
              --latest=false
          fi

          # Upload all required updater files, replacing previous assets.
          gh release upload app "$APK" "$CHECKSUM" "$VERSION_JSON" \
            --repo "${{ github.repository }}" --clobber

          # Verify that all three assets are available on the release.
          gh release view app --repo "${{ github.repository }}" \
            --json assets \
            --jq '.assets[].name' | tee published-assets.txt

          grep -Fxq "HorizonNav-public.apk" published-assets.txt
          grep -Fxq "HorizonNav-public.apk.sha256" published-assets.txt
          grep -Fxq "version.json" published-assets.txt

          echo "Published ${VERSION} successfully."
          echo "Download link: https://github.com/${{ github.repository }}/releases/download/app/HorizonNav-public.apk"
