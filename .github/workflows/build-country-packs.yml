# Builds offline packs (routing, map, search lists) for any country, US state or Canadian province, from the free OpenStreetMap
# extracts on download.geofabrik.de, and publishes each as a GitHub release the app downloads from.
#
# Run it from the Actions tab: Build country packs > Run workflow, and type the areas as Geofabrik paths, separated by commas, e.g.
#   europe/france, europe/germany, north-america/us/california, north-america/canada/ontario, south-america/brazil
# (the path is the part of the Geofabrik download link between "download.geofabrik.de/" and "-latest.osm.pbf").
#
# Each area becomes the release "pack-<name>", with the continent left off: europe/france -> pack-france,
# north-america/us/georgia -> pack-us-georgia. The app uses the same rule, so a pack appears in it as soon as its build finishes.
# Mode "extras only" just adds the speed limit and speed camera files to areas that are already built (minutes per area instead
# of hours): use it to give older packs offline speed limits. The UK packs (built in HeadUnitOrbis) get theirs here too: type
# "ew" (England & Wales) or "gb" (Great Britain) as the area, and their extras go in this repo's releases pack-ew and pack-gb.
# Smaller areas cut out of a bigger extract (Geofabrik has none of their own) are typed as cut/<name>: cut/singapore, cut/brunei.
# They become pack-singapore and pack-brunei. To add another, add a line for it in each "Download the OpenStreetMap extract" step.
# Up to 320 areas can go in one run. Every area is built as three jobs side by side (routing, map, search lists), so even big countries stay under GitHub's 6-hour limit.
name: Build country packs
on:
  workflow_dispatch:
    inputs:
      regions:
        description: "Geofabrik areas, comma separated (e.g. europe/france, north-america/us/texas)"
        required: true
        default: "europe/france"
      mode:
        description: "full = build everything; extras only = just add speed limits and cameras to packs already built; map only = just redo the map (e.g. after map builds failed)"
        type: choice
        options: ["full", "extras only", "map only"]
        default: "full"
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    # GitHub allows at most 256 jobs per list, and every area is 3 jobs, so the areas are shared out over up to four lists of 80
    outputs:
      a1: ${{ steps.plan.outputs.a1 }}
      a2: ${{ steps.plan.outputs.a2 }}
      a3: ${{ steps.plan.outputs.a3 }}
      a4: ${{ steps.plan.outputs.a4 }}
      parts: ${{ steps.plan.outputs.parts }}
    steps:
      - name: Work out the release names and create the releases
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REGIONS: ${{ inputs.regions }}
          MODE: ${{ inputs.mode }}
        run: |
          python3 - <<'PY' > areas.json
          import json, os
          out = []
          for p in os.environ["REGIONS"].replace("\n", ",").split(","):
              p = p.strip().strip("/")
              if not p: continue
              if p.endswith("-latest.osm.pbf"): p = p[:-len("-latest.osm.pbf")]
              p = p.replace("https://download.geofabrik.de/", "")
              # the UK packs from HeadUnitOrbis: their extras are built from the Great Britain extract
              if p.lower() in ("ew", "gb"):
                  out.append({"path": "europe/great-britain", "tag": "pack-" + p.lower()}); continue
              parts = p.split("/")
              tag = "pack-" + "-".join(parts[1:] if len(parts) > 1 else parts)
              out.append({"path": p, "tag": tag})
          print(json.dumps(out))
          PY
          cat areas.json
          for t in $(python3 -c "import json;print(' '.join(a['tag'] for a in json.load(open('areas.json'))))"); do
            gh release create "$t" --repo "${{ github.repository }}" --title "$t" --notes "Offline pack for Horizon Nav" 2>/dev/null || echo "$t already exists"
          done
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          a = json.load(open("areas.json"))
          if len(a) > 320: raise SystemExit("Too many areas in one run (%d): the most is 320" % len(a))
          for i in range(4):
              print("a%d=%s" % (i + 1, json.dumps(a[i * 80:(i + 1) * 80])))
          import os
          m = os.environ.get("MODE")
          print("parts=%s" % json.dumps(["extras"] if m == "extras only" else ["map"] if m == "map only" else ["routing", "map", "lists"]))
          PY

  # The map builds all need the same big files (the world's coastline and sea outlines, about 900 MB, and Natural Earth). Fetched
  # from their own servers by every job at once, those servers stopped answering and the map builds failed ("HTTP connect timed
  # out"). So they're fetched once here, kept in this repo's "planetiler-sources" release, and every map build takes them from there.
  sources:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Keep a copy of the map's shared source files in this repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REL=planetiler-sources
          gh release create "$REL" --repo "${{ github.repository }}" --title "$REL" --notes "Shared files for building offline maps (kept here so the map builds don't all download them from their own servers at once)" 2>/dev/null || true
          have=$(gh release view "$REL" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' 2>/dev/null || true)
          fetch() {   # name, url: download with patient retries, then keep it in the release
            n="$1"; u="$2"
            if echo "$have" | grep -qx "$n"; then echo "$n is already kept"; return 0; fi
            for try in 1 2 3 4 5 6 7 8; do
              echo "Downloading $u (try $try)"
              if curl -fL --retry 3 --retry-all-errors --retry-delay 30 --connect-timeout 60 -A "HorizonNav-pack-builder" -o "$n" "$u" \
                 && [ "$(stat -c%s "$n")" -gt 1000000 ]; then
                gh release upload "$REL" "$n" --repo "${{ github.repository }}" --clobber && return 0
              fi
              rm -f "$n"; sleep $(( 120 * try ))
            done
            echo "Couldn't fetch $n: the map builds will try to download it themselves"
          }
          fetch water-polygons-split-3857.zip https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip
          fetch natural_earth_vector.sqlite.zip https://naciscdn.org/naturalearth/packages/natural_earth_vector.sqlite.zip
          fetch lake_centerline.shp.zip https://github.com/acalcutt/osm-lakelines/releases/download/v12/lake_centerline.shp.zip

  build1:
    needs: [plan, sources]
    if: ${{ !cancelled() && needs.plan.outputs.a1 != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        area: ${{ fromJson(needs.plan.outputs.a1) }}
        part: ${{ fromJson(needs.plan.outputs.parts) }}
    name: ${{ matrix.area.tag }} ${{ matrix.part }}
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/.ghcup || true
          sudo docker image prune -af > /dev/null || true
          df -h /
      - name: Download the OpenStreetMap extract
        run: |
          # work on whichever disk has more room (big countries need tens of GB along the way)
          if [ -d /mnt ] && [ "$(df --output=avail /mnt | tail -1)" -gt "$(df --output=avail . | tail -1)" ]; then
            sudo mkdir -p /mnt/data && sudo chown "$USER" /mnt/data && ln -s /mnt/data data
          else
            mkdir -p data
          fi
          df -h . /mnt || true
          # lots of jobs start together, so spread their downloads out a little, and keep trying if the server is busy;
          # if Geofabrik won't give it, the same extract is fetched from the openstreetmap.fr mirror instead
          sleep $(( RANDOM % 90 ))
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          P="${{ matrix.area.path }}"
          # smaller areas that Geofabrik has no extract of their own for ("cut/<name>"): the bigger extract they're in is
          # downloaded and the area is cut out of it by its box (the pack then reaches a little over the border, which is fine)
          BBOX=""
          case "$P" in
            cut/singapore) P="asia/malaysia-singapore-brunei"; BBOX="103.55,1.13,104.13,1.50" ;;
            cut/brunei)    P="asia/malaysia-singapore-brunei"; BBOX="113.95,3.95,115.40,5.10" ;;
          esac
          ok=""
          for U in "https://download.geofabrik.de/$P-latest.osm.pbf" "https://download.openstreetmap.fr/extracts/$P.osm.pbf"; do
            for try in 1 2 3 4 5 6; do
              echo "Downloading $U (try $try)"
              if curl -fL --retry 3 --retry-all-errors --retry-delay 30 --connect-timeout 30 -A "HorizonNav-pack-builder" -o data/region.osm.pbf "$U" \
                 && [ "$(stat -c%s data/region.osm.pbf)" -gt 10000 ]; then ok=1; break; fi
              rm -f data/region.osm.pbf
              sleep $(( 60 * try ))
            done
            [ -n "$ok" ] && break
          done
          [ -n "$ok" ] || { echo "Couldn't download $P from Geofabrik or the mirror - check the path on download.geofabrik.de"; exit 1; }
          if [ -n "$BBOX" ]; then
            echo "Cutting out $BBOX"
            osmium extract -b "$BBOX" --strategy=complete_ways data/region.osm.pbf -o data/cut.osm.pbf --overwrite
            mv data/cut.osm.pbf data/region.osm.pbf
          fi
          ls -l data

      # ---------------- routing ----------------
      - name: Build the routing tiles with Valhalla
        if: matrix.part == 'routing'
        run: |
          docker run --rm -v "$PWD/data:/data" --entrypoint /bin/bash ghcr.io/valhalla/valhalla:latest -c '
            set -e
            cd /data
            valhalla_build_config --mjolnir-tile-dir /data/tiles --mjolnir-tile-extract /data/tiles.tar --mjolnir-timezone /data/tz.sqlite --mjolnir-admin /data/admins.sqlite > valhalla.json
            valhalla_build_timezones > tz.sqlite
            valhalla_build_admins -c valhalla.json region.osm.pbf
            valhalla_build_tiles -c valhalla.json region.osm.pbf
            valhalla_build_extract -c valhalla.json -v
            rm -rf /data/tiles
          '
          sudo chown -R "$USER" data
          ls -l data

      # ---------------- map ----------------
      - name: Fetch the map's shared source files from this repo
        if: matrix.part == 'map'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # (kept by the "sources" job; anything missing is downloaded by planetiler itself as before)
          mkdir -p data/sources
          for n in water-polygons-split-3857.zip natural_earth_vector.sqlite.zip lake_centerline.shp.zip; do
            for try in 1 2 3; do
              gh release download planetiler-sources --repo "${{ github.repository }}" -p "$n" -D data/sources --clobber && break
              sleep $(( 30 * try ))
            done
          done
          # the coastline and sea file still missing (its server has been refusing GitHub at times): the map is built without the
          # sea rather than not at all (a pack only shows as ready with its map). Inland it looks the same; on the coast the sea
          # shows in the land colour until the map is rebuilt ("map only") once the file can be fetched again
          W=data/sources/water-polygons-split-3857.zip
          if [ ! -s "$W" ]; then
            curl -fL --connect-timeout 20 --max-time 1800 -A "HorizonNav-pack-builder" -o "$W" https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip || rm -f "$W"
          fi
          if [ ! -s "$W" ] || [ "$(stat -c%s "$W")" -lt 1000000 ]; then
            echo "::warning::No coastline and sea file: building this map without the sea. Run it again with mode 'map only' once the file is in the planetiler-sources release."
            python3 - "$W" <<'PY'
          # an empty shapefile (no shapes) in the same layout as the real file, so the map build carries on without the sea
          import struct, sys, zipfile, io
          def header(words):
              return struct.pack(">7i", 9994, 0, 0, 0, 0, 0, words) + struct.pack("<2i", 1000, 5) + struct.pack("<8d", 0, 0, 0, 0, 0, 0, 0, 0)
          shp = header(50); shx = header(50)
          dbf = struct.pack("<4BIHH20x", 3, 126, 1, 1, 0, 32 + 32 + 1, 11) + b"x".ljust(11, b"\0") + b"N" + b"\0" * 4 + bytes([10, 0]) + b"\0" * 14 + b"\r" + b"\x1a"
          prj = b'PROJCS["WGS 84 / Pseudo-Mercator",GEOGCS["WGS 84",DATUM["WGS_1984",SPHEROID["WGS 84",6378137,298.257223563]],PRIMEM["Greenwich",0],UNIT["degree",0.0174532925199433]],PROJECTION["Mercator_1SP"],PARAMETER["central_meridian",0],PARAMETER["scale_factor",1],PARAMETER["false_easting",0],PARAMETER["false_northing",0],UNIT["metre",1]]'
          with zipfile.ZipFile(sys.argv[1], "w") as z:
              for ext, data in (("shp", shp), ("shx", shx), ("dbf", dbf), ("prj", prj)):
                  z.writestr("water-polygons-split-3857/water_polygons." + ext, data)
          PY
          fi
          ls -l data/sources || true
      - name: Build the offline map (planetiler)
        if: matrix.part == 'map'
        run: |
          MEM=$(( $(free -g | awk '/Mem:/{print $2}') - 3 ))
          docker run --rm -e JAVA_TOOL_OPTIONS="-Xmx${MEM}g" -v "$PWD/data:/data" ghcr.io/onthegomap/planetiler:latest \
            --osm-path=/data/region.osm.pbf --output=/data/map.pmtiles --download --download_dir=/data/sources \
            --force --maxzoom=14 --fetch-wikidata=false --storage=mmap
          sudo chown -R "$USER" data
          rm -rf data/sources
          ls -l data/map.pmtiles
      - name: Fonts for the map labels
        if: matrix.part == 'map'
        run: |
          curl -fL -o fonts-src.zip https://github.com/openmaptiles/fonts/releases/download/v2.0/v2.0.zip
          mkdir -p fsrc fontout
          unzip -q fonts-src.zip -d fsrc
          for f in "Noto Sans Regular" "Noto Sans Bold"; do
            d=$(find fsrc -type d -name "$f" | head -1)
            echo "$f -> $d"
            cp -r "$d" "fontout/$(echo "$f" | tr -d ' ')"
          done
          (cd fontout && zip -qr ../data/fonts.zip .)
          ls -l data/fonts.zip

      # ---------------- search lists, lamps and traffic lights ----------------
      - name: Build a search list of streets, shops and places
        if: matrix.part == 'lists'
        run: |
          osmium tags-filter data/region.osm.pbf w/highway nwr/amenity nwr/shop nwr/tourism nwr/leisure nwr/office nwr/railway=station nwr/place -o data/named.osm.pbf --overwrite
          osmium export data/named.osm.pbf -f geojsonseq --geometry-types=point,linestring,polygon -o data/named.geojsonseq --overwrite
          rm -f data/named.osm.pbf
          python3 - <<'PY'
          import json
          roads = {"motorway","trunk","primary","secondary","tertiary","unclassified","residential","living_street","pedestrian","road","motorway_link","trunk_link","primary_link","secondary_link"}
          seen = set(); n = 0
          def mid(g):
              c = g["coordinates"]
              if g["type"] == "Point": return c[1], c[0]
              if g["type"] == "LineString": p = c[len(c)//2]; return p[1], p[0]
              if g["type"] == "Polygon": p = c[0][0]; return p[1], p[0]
              return None
          with open("data/named.geojsonseq", encoding="utf-8") as f, open("data/places.tsv", "w", encoding="utf-8") as out:
              for line in f:
                  line = line.strip().lstrip("\x1e")
                  if not line: continue
                  try: ft = json.loads(line)
                  except Exception: continue
                  pr = ft.get("properties") or {}
                  name = (pr.get("name") or "").replace("\t", " ").strip()
                  if not name or not ft.get("geometry"): continue
                  hw = pr.get("highway")
                  if hw:
                      if hw not in roads: continue
                      kind = "Street"
                  else:
                      kind = None
                      for k in ("place", "amenity", "shop", "tourism", "leisure", "office", "railway"):
                          if pr.get(k): kind = pr[k].replace("_", " ").capitalize(); break
                      if kind is None: continue
                  m = mid(ft["geometry"])
                  if not m: continue
                  key = hash((name.lower(), kind, round(m[0], 2), round(m[1], 2)))
                  if key in seen: continue
                  seen.add(key)
                  out.write("%s\t%s\t%.5f\t%.5f\n" % (name, kind, m[0], m[1])); n += 1
          print("places written:", n)
          PY
          rm -f data/named.geojsonseq
          ls -l data/places.tsv
          # a word index for the search list: every word of every name with where its line starts in places.tsv, sorted, so the
          # app can find names by their first letters without reading the whole list
          python3 - <<'PY'
          import re
          wre = re.compile(r"[^\w]+")
          n = 0
          with open("data/places.tsv", "rb") as f, open("data/names.unsorted", "w", encoding="utf-8") as o:
              off = 0
              for raw in f:
                  name = raw.decode("utf-8", "replace").split("\t", 1)[0].lower()
                  for w in set(x for x in wre.split(name) if len(x) >= 2):
                      o.write("%s\t%d\n" % (w, off)); n += 1
                  off += len(raw)
          print("index entries:", n)
          PY
          LC_ALL=C sort -S 3G -T data data/names.unsorted > data/names.idx
          rm -f data/names.unsorted
          ls -l data/names.idx
      - name: Build house number and postcode lists
        if: matrix.part == 'lists'
        run: |
          osmium tags-filter data/region.osm.pbf nwr/addr:housenumber -o data/addr.osm.pbf --overwrite
          osmium export data/addr.osm.pbf -f geojsonseq --geometry-types=point,polygon -o data/addr.geojsonseq --overwrite
          rm -f data/addr.osm.pbf
          python3 - <<'PY'
          import json
          seen = set(); pcs = {}; n = 0
          def pt(g):
              c = g["coordinates"]
              if g["type"] == "Point": return c[1], c[0]
              if g["type"] == "Polygon":
                  r = c[0]; k = len(r) - 1 if len(r) > 1 else 1
                  return sum(p[1] for p in r[:k]) / k, sum(p[0] for p in r[:k]) / k
              return None
          def key(s): return "".join(ch.lower() if ch < "\x80" else ch for ch in s)
          with open("data/addr.geojsonseq", encoding="utf-8") as f, open("data/addr.unsorted", "w", encoding="utf-8") as out:
              for line in f:
                  line = line.strip().lstrip("\x1e")
                  if not line: continue
                  try: ft = json.loads(line)
                  except Exception: continue
                  pr = ft.get("properties") or {}
                  num = (pr.get("addr:housenumber") or "").replace("\t", " ").strip()
                  street = (pr.get("addr:street") or pr.get("addr:place") or "").replace("\t", " ").strip()
                  if not num or not street or not ft.get("geometry"): continue
                  p = pt(ft["geometry"])
                  if not p: continue
                  pc = (pr.get("addr:postcode") or "").replace("\t", " ").strip().upper()
                  h = hash((key(street), num.lower(), round(p[0], 4), round(p[1], 4)))
                  if h in seen: continue
                  seen.add(h)
                  out.write("%s\t%s\t%s\t%.5f\t%.5f\t%s\n" % (key(street), street, num, p[0], p[1], pc)); n += 1
                  if pc:
                      a = pcs.get(pc)
                      if a: a[0] += p[0]; a[1] += p[1]; a[2] += 1
                      else: pcs[pc] = [p[0], p[1], 1]
          with open("data/postcodes.tsv", "w", encoding="utf-8") as o:
              for pc in sorted(pcs, key=lambda x: x.replace(" ", "")):
                  a = pcs[pc]
                  o.write("%s\t%s\t%.5f\t%.5f\n" % (pc.replace(" ", "").lower(), pc, a[0] / a[2], a[1] / a[2]))
          print("addresses:", n, "postcodes:", len(pcs))
          PY
          rm -f data/addr.geojsonseq
          LC_ALL=C sort -S 4G -T data -t "$(printf '\t')" -k1,1 data/addr.unsorted | cut -f2- > data/addresses.tsv
          rm -f data/addr.unsorted
          ls -l data/addresses.tsv data/postcodes.tsv
      - name: Build street lamp and traffic light lists
        if: matrix.part == 'lists'
        run: |
          for kind in street_lamp:lamps traffic_signals:signals; do
            tag="${kind%%:*}"; out="${kind##*:}"
            osmium tags-filter data/region.osm.pbf "n/highway=$tag" -o "data/$out.osm.pbf" --overwrite
            osmium export "data/$out.osm.pbf" -f geojsonseq --geometry-types=point -o "data/$out.geojsonseq" --overwrite
            python3 - "$out" <<'PY'
          import json, math, sys
          name = sys.argv[1]; n = 0
          with open("data/%s.geojsonseq" % name, encoding="utf-8") as f, open("data/%s.unsorted" % name, "w") as o:
              for line in f:
                  line = line.lstrip("\x1e").strip()
                  if not line: continue
                  try: lon, lat = json.loads(line)["geometry"]["coordinates"]
                  except Exception: continue
                  x = min(32767, max(0, int((lon + 180.0) / 360.0 * 32768)))
                  r = math.radians(lat)
                  y = min(32767, max(0, int((1.0 - math.log(math.tan(r) + 1.0 / math.cos(r)) / math.pi) / 2.0 * 32768)))
                  o.write("%05d%05d\t%.6f\t%.6f\n" % (y, x, lat, lon)); n += 1
          print(name, n)
          PY
            LC_ALL=C sort -S 1G -T data "data/$out.unsorted" > "data/$out.tsv"
            rm -f "data/$out.unsorted" "data/$out.osm.pbf" "data/$out.geojsonseq"
          done
          ls -l data/lamps.tsv data/signals.tsv

      # ---------------- speed limits and speed cameras (full builds and "extras only") ----------------
      - name: Build speed limit and speed camera lists
        if: matrix.part == 'lists' || matrix.part == 'extras'
        run: |
          # speed cameras: the same tile-sorted list as the traffic lights
          osmium tags-filter data/region.osm.pbf "n/highway=speed_camera" -o data/cams.osm.pbf --overwrite
          osmium export data/cams.osm.pbf -f geojsonseq --geometry-types=point -o data/cams.geojsonseq --overwrite
          python3 - <<'PY'
          import json, math
          n = 0
          with open("data/cams.geojsonseq", encoding="utf-8") as f, open("data/cameras.unsorted", "w") as o:
              for line in f:
                  line = line.lstrip("\x1e").strip()
                  if not line: continue
                  try:
                      ft = json.loads(line); lon, lat = ft["geometry"]["coordinates"]
                  except Exception: continue
                  # which way the camera checks traffic, in degrees, when it's mapped (a 4th column; blank when not known)
                  pr = ft.get("properties") or {}
                  dv = str(pr.get("direction") or pr.get("camera:direction") or "").strip().upper()
                  card = {"N":0,"NNE":22.5,"NE":45,"ENE":67.5,"E":90,"ESE":112.5,"SE":135,"SSE":157.5,"S":180,"SSW":202.5,"SW":225,"WSW":247.5,"W":270,"WNW":292.5,"NW":315,"NNW":337.5}
                  d = ""
                  if dv and ";" not in dv:
                      if dv in card: d = "%g" % card[dv]
                      else:
                          try: d = "%g" % (float(dv) % 360.0)
                          except ValueError: d = ""
                  x = min(32767, max(0, int((lon + 180.0) / 360.0 * 32768)))
                  r = math.radians(lat)
                  y = min(32767, max(0, int((1.0 - math.log(math.tan(r) + 1.0 / math.cos(r)) / math.pi) / 2.0 * 32768)))
                  o.write("%05d%05d\t%.6f\t%.6f\t%s\n" % (y, x, lat, lon, d)); n += 1
          print("cameras", n)
          PY
          LC_ALL=C sort -S 1G -T data data/cameras.unsorted > data/cameras.tsv
          rm -f data/cameras.unsorted data/cams.osm.pbf data/cams.geojsonseq
          # every road a car can use, with its speed limit tags and shape, grouped by zoom-14 tile (see OfflineLimits.kt in the app)
          osmium tags-filter data/region.osm.pbf w/highway=motorway,motorway_link,trunk,trunk_link,primary,primary_link,secondary,secondary_link,tertiary,tertiary_link,unclassified,residential,living_street,service,road -o data/roads.osm.pbf --overwrite
          osmium export data/roads.osm.pbf -f geojsonseq --geometry-types=linestring --add-unique-id=type_id -o data/roads.geojsonseq --overwrite
          rm -f data/roads.osm.pbf
          python3 - <<'PY'
          import json, math, base64
          HW = ["motorway","motorway_link","trunk","trunk_link","primary","primary_link","secondary","secondary_link","tertiary","tertiary_link","unclassified","residential","living_street","service","road"]
          HI = {h: i for i, h in enumerate(HW)}
          Z = 16384
          def tile(lat, lon):
              x = min(Z - 1, max(0, int((lon + 180.0) / 360.0 * Z)))
              r = math.radians(max(-85.0, min(85.0, lat)))
              y = min(Z - 1, max(0, int((1.0 - math.log(math.tan(r) + 1.0 / math.cos(r)) / math.pi) / 2.0 * Z)))
              return y * Z + x
          def uv(n, out):
              while True:
                  b = n & 0x7f; n >>= 7
                  if n: out.append(b | 0x80)
                  else: out.append(b); return
          def zz(n): return (n << 1) ^ (n >> 63)
          def st(s, out):
              b = str(s or "").replace("\t", " ").encode("utf-8")[:255]
              uv(len(b), out); out.extend(b)
          n = 0
          with open("data/roads.geojsonseq", encoding="utf-8") as f, open("data/limits.unsorted", "w") as o:
              for line in f:
                  line = line.lstrip("\x1e").strip()
                  if not line: continue
                  try: ft = json.loads(line)
                  except Exception: continue
                  g = ft.get("geometry") or {}
                  if g.get("type") != "LineString": continue
                  pr = ft.get("properties") or {}
                  hw = pr.get("highway")
                  if hw not in HI: continue
                  # driveways and car park aisles are left out (they only get in the way of matching the road you're on)
                  if hw == "service" and pr.get("service") and not pr.get("maxspeed"): continue
                  c = g.get("coordinates") or []
                  if len(c) < 2: continue
                  fid = str(ft.get("id", "w0"))
                  wid = int(fid[1:]) if fid[1:].isdigit() else 0
                  ow = str(pr.get("oneway", "")).lower(); jn = str(pr.get("junction", "")).lower()
                  flags = (1 if ow in ("yes", "true", "1") else 0) | (2 if ow == "-1" else 0) | (4 if jn in ("roundabout", "circular") else 0)
                  mt = pr.get("maxspeed:type") or pr.get("source:maxspeed") or pr.get("zone:maxspeed") or ""
                  pts = [(int(round(p[1] * 1e5)), int(round(p[0] * 1e5))) for p in c]
                  dd = [pts[0]]
                  for q in pts[1:]:
                      if q != dd[-1]: dd.append(q)
                  if len(dd) < 2: continue
                  rec = bytearray([HI[hw], flags]); uv(wid, rec)
                  for s in (pr.get("name"), pr.get("ref"), pr.get("maxspeed"), mt, pr.get("maxspeed:forward"), pr.get("maxspeed:backward")): st(s, rec)
                  uv(len(dd), rec); uv(dd[0][0] + 9000000, rec); uv(dd[0][1] + 18000000, rec)
                  for i in range(1, len(dd)):
                      uv(zz(dd[i][0] - dd[i - 1][0]), rec); uv(zz(dd[i][1] - dd[i - 1][1]), rec)
                  keys = set()
                  for i in range(len(c) - 1):
                      a = c[i]; b = c[i + 1]
                      dy = (b[1] - a[1]) * 111320.0; dx = (b[0] - a[0]) * 111320.0 * math.cos(math.radians(a[1]))
                      steps = int(math.hypot(dx, dy) / 100.0) + 1
                      for k in range(steps + 1):
                          t = k / steps
                          keys.add(tile(a[1] + (b[1] - a[1]) * t, a[0] + (b[0] - a[0]) * t))
                  enc = base64.b64encode(bytes(rec)).decode()
                  for k in keys: o.write("%09d\t%s\n" % (k, enc))
                  n += 1
          print("roads", n)
          PY
          rm -f data/roads.geojsonseq
          LC_ALL=C sort -S 3G -T data data/limits.unsorted > data/limits.sorted
          rm -f data/limits.unsorted
          python3 - <<'PY'
          import base64, zlib, struct
          def uv(n, out):
              while True:
                  b = n & 0x7f; n >>= 7
                  if n: out.append(b | 0x80)
                  else: out.append(b); return
          idx = []; state = {"off": 0, "cur": None, "recs": []}
          def flush(o):
              if state["cur"] is None: return
              blob = bytearray(); uv(len(state["recs"]), blob)
              for r in state["recs"]: blob.extend(r)
              z = zlib.compress(bytes(blob), 9)
              o.write(z); idx.append((state["cur"], state["off"], len(z))); state["off"] += len(z)
          with open("data/limits.sorted") as f, open("data/limits.blobs", "wb") as o:
              for line in f:
                  k, _, e = line.rstrip("\n").partition("\t")
                  k = int(k)
                  if k != state["cur"]:
                      flush(o); state["cur"] = k; state["recs"] = []
                  state["recs"].append(base64.b64decode(e))
              flush(o)
          with open("data/limits.bin", "wb") as o:
              o.write(b"HNL1"); o.write(struct.pack(">II", 14, len(idx)))
              for k, of, ln in idx: o.write(struct.pack(">III", k, of, ln))
              with open("data/limits.blobs", "rb") as b:
                  while True:
                      ch = b.read(1 << 20)
                      if not ch: break
                      o.write(ch)
          print("tiles", len(idx))
          PY
          rm -f data/limits.sorted data/limits.blobs
          ls -l data/cameras.tsv data/limits.bin

      # ---------------- publish ----------------
      - name: Publish to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f data/region.osm.pbf data/tz.sqlite
          # GitHub refuses release files of 2 GB or more, so a bigger file is cut into parts (the app joins them again)
          for big in tiles.tar map.pmtiles addresses.tsv places.tsv names.idx; do
            if [ -f "data/$big" ] && [ "$(stat -c%s data/$big)" -gt 1900000000 ]; then
              split -b 1800M -d -a 2 "data/$big" "data/$big.part" && rm "data/$big"
            fi
          done
          FILES=""
          for f in data/tiles.tar data/tiles.tar.part* data/admins.sqlite data/valhalla.json data/places.tsv data/places.tsv.part* data/names.idx data/names.idx.part* data/map.pmtiles data/map.pmtiles.part* data/fonts.zip data/addresses.tsv data/addresses.tsv.part* data/postcodes.tsv data/lamps.tsv data/signals.tsv data/cameras.tsv data/limits.bin; do
            # GitHub won't take an empty file (an area with no traffic lights mapped, say): the app copes without it
            [ -s "$f" ] && FILES="$FILES $f"
          done
          [ -n "$FILES" ] || { echo "Nothing to publish"; exit 1; }
          # (in "extras only" mode just the speed limit and camera files are here: the rest of the release is left as it is)
          ls -l $FILES
          gh release upload "${{ matrix.area.tag }}" $FILES --repo "${{ github.repository }}" --clobber
          echo "Download address: https://github.com/${{ github.repository }}/releases/download/${{ matrix.area.tag }}"

  build2:
    needs: [plan, sources]
    if: ${{ !cancelled() && needs.plan.outputs.a2 != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        area: ${{ fromJson(needs.plan.outputs.a2) }}
        part: ${{ fromJson(needs.plan.outputs.parts) }}
    name: ${{ matrix.area.tag }} ${{ matrix.part }}
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/.ghcup || true
          sudo docker image prune -af > /dev/null || true
          df -h /
      - name: Download the OpenStreetMap extract
        run: |
          # work on whichever disk has more room (big countries need tens of GB along the way)
          if [ -d /mnt ] && [ "$(df --output=avail /mnt | tail -1)" -gt "$(df --output=avail . | tail -1)" ]; then
            sudo mkdir -p /mnt/data && sudo chown "$USER" /mnt/data && ln -s /mnt/data data
          else
            mkdir -p data
          fi
          df -h . /mnt || true
          # lots of jobs start together, so spread their downloads out a little, and keep trying if the server is busy;
          # if Geofabrik won't give it, the same extract is fetched from the openstreetmap.fr mirror instead
          sleep $(( RANDOM % 90 ))
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          P="${{ matrix.area.path }}"
          # smaller areas that Geofabrik has no extract of their own for ("cut/<name>"): the bigger extract they're in is
          # downloaded and the area is cut out of it by its box (the pack then reaches a little over the border, which is fine)
          BBOX=""
          case "$P" in
            cut/singapore) P="asia/malaysia-singapore-brunei"; BBOX="103.55,1.13,104.13,1.50" ;;
            cut/brunei)    P="asia/malaysia-singapore-brunei"; BBOX="113.95,3.95,115.40,5.10" ;;
          esac
          ok=""
          for U in "https://download.geofabrik.de/$P-latest.osm.pbf" "https://download.openstreetmap.fr/extracts/$P.osm.pbf"; do
            for try in 1 2 3 4 5 6; do
              echo "Downloading $U (try $try)"
              if curl -fL --retry 3 --retry-all-errors --retry-delay 30 --connect-timeout 30 -A "HorizonNav-pack-builder" -o data/region.osm.pbf "$U" \
                 && [ "$(stat -c%s data/region.osm.pbf)" -gt 10000 ]; then ok=1; break; fi
              rm -f data/region.osm.pbf
              sleep $(( 60 * try ))
            done
            [ -n "$ok" ] && break
          done
          [ -n "$ok" ] || { echo "Couldn't download $P from Geofabrik or the mirror - check the path on download.geofabrik.de"; exit 1; }
          if [ -n "$BBOX" ]; then
            echo "Cutting out $BBOX"
            osmium extract -b "$BBOX" --strategy=complete_ways data/region.osm.pbf -o data/cut.osm.pbf --overwrite
            mv data/cut.osm.pbf data/region.osm.pbf
          fi
          ls -l data

      # ---------------- routing ----------------
      - name: Build the routing tiles with Valhalla
        if: matrix.part == 'routing'
        run: |
          docker run --rm -v "$PWD/data:/data" --entrypoint /bin/bash ghcr.io/valhalla/valhalla:latest -c '
            set -e
            cd /data
            valhalla_build_config --mjolnir-tile-dir /data/tiles --mjolnir-tile-extract /data/tiles.tar --mjolnir-timezone /data/tz.sqlite --mjolnir-admin /data/admins.sqlite > valhalla.json
            valhalla_build_timezones > tz.sqlite
            valhalla_build_admins -c valhalla.json region.osm.pbf
            valhalla_build_tiles -c valhalla.json region.osm.pbf
            valhalla_build_extract -c valhalla.json -v
            rm -rf /data/tiles
          '
          sudo chown -R "$USER" data
          ls -l data

      # ---------------- map ----------------
      - name: Fetch the map's shared source files from this repo
        if: matrix.part == 'map'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # (kept by the "sources" job; anything missing is downloaded by planetiler itself as before)
          mkdir -p data/sources
          for n in water-polygons-split-3857.zip natural_earth_vector.sqlite.zip lake_centerline.shp.zip; do
            for try in 1 2 3; do
              gh release download planetiler-sources --repo "${{ github.repository }}" -p "$n" -D data/sources --clobber && break
              sleep $(( 30 * try ))
            done
          done
          # the coastline and sea file still missing (its server has been refusing GitHub at times): the map is built without the
          # sea rather than not at all (a pack only shows as ready with its map). Inland it looks the same; on the coast the sea
          # shows in the land colour until the map is rebuilt ("map only") once the file can be fetched again
          W=data/sources/water-polygons-split-3857.zip
          if [ ! -s "$W" ]; then
            curl -fL --connect-timeout 20 --max-time 1800 -A "HorizonNav-pack-builder" -o "$W" https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip || rm -f "$W"
          fi
          if [ ! -s "$W" ] || [ "$(stat -c%s "$W")" -lt 1000000 ]; then
            echo "::warning::No coastline and sea file: building this map without the sea. Run it again with mode 'map only' once the file is in the planetiler-sources release."
            python3 - "$W" <<'PY'
          # an empty shapefile (no shapes) in the same layout as the real file, so the map build carries on without the sea
          import struct, sys, zipfile, io
          def header(words):
              return struct.pack(">7i", 9994, 0, 0, 0, 0, 0, words) + struct.pack("<2i", 1000, 5) + struct.pack("<8d", 0, 0, 0, 0, 0, 0, 0, 0)
          shp = header(50); shx = header(50)
          dbf = struct.pack("<4BIHH20x", 3, 126, 1, 1, 0, 32 + 32 + 1, 11) + b"x".ljust(11, b"\0") + b"N" + b"\0" * 4 + bytes([10, 0]) + b"\0" * 14 + b"\r" + b"\x1a"
          prj = b'PROJCS["WGS 84 / Pseudo-Mercator",GEOGCS["WGS 84",DATUM["WGS_1984",SPHEROID["WGS 84",6378137,298.257223563]],PRIMEM["Greenwich",0],UNIT["degree",0.0174532925199433]],PROJECTION["Mercator_1SP"],PARAMETER["central_meridian",0],PARAMETER["scale_factor",1],PARAMETER["false_easting",0],PARAMETER["false_northing",0],UNIT["metre",1]]'
          with zipfile.ZipFile(sys.argv[1], "w") as z:
              for ext, data in (("shp", shp), ("shx", shx), ("dbf", dbf), ("prj", prj)):
                  z.writestr("water-polygons-split-3857/water_polygons." + ext, data)
          PY
          fi
          ls -l data/sources || true
      - name: Build the offline map (planetiler)
        if: matrix.part == 'map'
        run: |
          MEM=$(( $(free -g | awk '/Mem:/{print $2}') - 3 ))
          docker run --rm -e JAVA_TOOL_OPTIONS="-Xmx${MEM}g" -v "$PWD/data:/data" ghcr.io/onthegomap/planetiler:latest \
            --osm-path=/data/region.osm.pbf --output=/data/map.pmtiles --download --download_dir=/data/sources \
            --force --maxzoom=14 --fetch-wikidata=false --storage=mmap
          sudo chown -R "$USER" data
          rm -rf data/sources
          ls -l data/map.pmtiles
      - name: Fonts for the map labels
        if: matrix.part == 'map'
        run: |
          curl -fL -o fonts-src.zip https://github.com/openmaptiles/fonts/releases/download/v2.0/v2.0.zip
          mkdir -p fsrc fontout
          unzip -q fonts-src.zip -d fsrc
          for f in "Noto Sans Regular" "Noto Sans Bold"; do
            d=$(find fsrc -type d -name "$f" | head -1)
            echo "$f -> $d"
            cp -r "$d" "fontout/$(echo "$f" | tr -d ' ')"
          done
          (cd fontout && zip -qr ../data/fonts.zip .)
          ls -l data/fonts.zip

      # ---------------- search lists, lamps and traffic lights ----------------
      - name: Build a search list of streets, shops and places
        if: matrix.part == 'lists'
        run: |
          osmium tags-filter data/region.osm.pbf w/highway nwr/amenity nwr/shop nwr/tourism nwr/leisure nwr/office nwr/railway=station nwr/place -o data/named.osm.pbf --overwrite
          osmium export data/named.osm.pbf -f geojsonseq --geometry-types=point,linestring,polygon -o data/named.geojsonseq --overwrite
          rm -f data/named.osm.pbf
          python3 - <<'PY'
          import json
          roads = {"motorway","trunk","primary","secondary","tertiary","unclassified","residential","living_street","pedestrian","road","motorway_link","trunk_link","primary_link","secondary_link"}
          seen = set(); n = 0
          def mid(g):
              c = g["coordinates"]
              if g["type"] == "Point": return c[1], c[0]
              if g["type"] == "LineString": p = c[len(c)//2]; return p[1], p[0]
              if g["type"] == "Polygon": p = c[0][0]; return p[1], p[0]
              return None
          with open("data/named.geojsonseq", encoding="utf-8") as f, open("data/places.tsv", "w", encoding="utf-8") as out:
              for line in f:
                  line = line.strip().lstrip("\x1e")
                  if not line: continue
                  try: ft = json.loads(line)
                  except Exception: continue
                  pr = ft.get("properties") or {}
                  name = (pr.get("name") or "").replace("\t", " ").strip()
                  if not name or not ft.get("geometry"): continue
                  hw = pr.get("highway")
                  if hw:
                      if hw not in roads: continue
                      kind = "Street"
                  else:
                      kind = None
                      for k in ("place", "amenity", "shop", "tourism", "leisure", "office", "railway"):
                          if pr.get(k): kind = pr[k].replace("_", " ").capitalize(); break
                      if kind is None: continue
                  m = mid(ft["geometry"])
                  if not m: continue
                  key = hash((name.lower(), kind, round(m[0], 2), round(m[1], 2)))
                  if key in seen: continue
                  seen.add(key)
                  out.write("%s\t%s\t%.5f\t%.5f\n" % (name, kind, m[0], m[1])); n += 1
          print("places written:", n)
          PY
          rm -f data/named.geojsonseq
          ls -l data/places.tsv
          # a word index for the search list: every word of every name with where its line starts in places.tsv, sorted, so the
          # app can find names by their first letters without reading the whole list
          python3 - <<'PY'
          import re
          wre = re.compile(r"[^\w]+")
          n = 0
          with open("data/places.tsv", "rb") as f, open("data/names.unsorted", "w", encoding="utf-8") as o:
              off = 0
              for raw in f:
                  name = raw.decode("utf-8", "replace").split("\t", 1)[0].lower()
                  for w in set(x for x in wre.split(name) if len(x) >= 2):
                      o.write("%s\t%d\n" % (w, off)); n += 1
                  off += len(raw)
          print("index entries:", n)
          PY
          LC_ALL=C sort -S 3G -T data data/names.unsorted > data/names.idx
          rm -f data/names.unsorted
          ls -l data/names.idx
      - name: Build house number and postcode lists
        if: matrix.part == 'lists'
        run: |
          osmium tags-filter data/region.osm.pbf nwr/addr:housenumber -o data/addr.osm.pbf --overwrite
          osmium export data/addr.osm.pbf -f geojsonseq --geometry-types=point,polygon -o data/addr.geojsonseq --overwrite
          rm -f data/addr.osm.pbf
          python3 - <<'PY'
          import json
          seen = set(); pcs = {}; n = 0
          def pt(g):
              c = g["coordinates"]
              if g["type"] == "Point": return c[1], c[0]
              if g["type"] == "Polygon":
                  r = c[0]; k = len(r) - 1 if len(r) > 1 else 1
                  return sum(p[1] for p in r[:k]) / k, sum(p[0] for p in r[:k]) / k
              return None
          def key(s): return "".join(ch.lower() if ch < "\x80" else ch for ch in s)
          with open("data/addr.geojsonseq", encoding="utf-8") as f, open("data/addr.unsorted", "w", encoding="utf-8") as out:
              for line in f:
                  line = line.strip().lstrip("\x1e")
                  if not line: continue
                  try: ft = json.loads(line)
                  except Exception: continue
                  pr = ft.get("properties") or {}
                  num = (pr.get("addr:housenumber") or "").replace("\t", " ").strip()
                  street = (pr.get("addr:street") or pr.get("addr:place") or "").replace("\t", " ").strip()
                  if not num or not street or not ft.get("geometry"): continue
                  p = pt(ft["geometry"])
                  if not p: continue
                  pc = (pr.get("addr:postcode") or "").replace("\t", " ").strip().upper()
                  h = hash((key(street), num.lower(), round(p[0], 4), round(p[1], 4)))
                  if h in seen: continue
                  seen.add(h)
                  out.write("%s\t%s\t%s\t%.5f\t%.5f\t%s\n" % (key(street), street, num, p[0], p[1], pc)); n += 1
                  if pc:
                      a = pcs.get(pc)
                      if a: a[0] += p[0]; a[1] += p[1]; a[2] += 1
                      else: pcs[pc] = [p[0], p[1], 1]
          with open("data/postcodes.tsv", "w", encoding="utf-8") as o:
              for pc in sorted(pcs, key=lambda x: x.replace(" ", "")):
                  a = pcs[pc]
                  o.write("%s\t%s\t%.5f\t%.5f\n" % (pc.replace(" ", "").lower(), pc, a[0] / a[2], a[1] / a[2]))
          print("addresses:", n, "postcodes:", len(pcs))
          PY
          rm -f data/addr.geojsonseq
          LC_ALL=C sort -S 4G -T data -t "$(printf '\t')" -k1,1 data/addr.unsorted | cut -f2- > data/addresses.tsv
          rm -f data/addr.unsorted
          ls -l data/addresses.tsv data/postcodes.tsv
      - name: Build street lamp and traffic light lists
        if: matrix.part == 'lists'
        run: |
          for kind in street_lamp:lamps traffic_signals:signals; do
            tag="${kind%%:*}"; out="${kind##*:}"
            osmium tags-filter data/region.osm.pbf "n/highway=$tag" -o "data/$out.osm.pbf" --overwrite
            osmium export "data/$out.osm.pbf" -f geojsonseq --geometry-types=point -o "data/$out.geojsonseq" --overwrite
            python3 - "$out" <<'PY'
          import json, math, sys
          name = sys.argv[1]; n = 0
          with open("data/%s.geojsonseq" % name, encoding="utf-8") as f, open("data/%s.unsorted" % name, "w") as o:
              for line in f:
                  line = line.lstrip("\x1e").strip()
                  if not line: continue
                  try: lon, lat = json.loads(line)["geometry"]["coordinates"]
                  except Exception: continue
                  x = min(32767, max(0, int((lon + 180.0) / 360.0 * 32768)))
                  r = math.radians(lat)
                  y = min(32767, max(0, int((1.0 - math.log(math.tan(r) + 1.0 / math.cos(r)) / math.pi) / 2.0 * 32768)))
                  o.write("%05d%05d\t%.6f\t%.6f\n" % (y, x, lat, lon)); n += 1
          print(name, n)
          PY
            LC_ALL=C sort -S 1G -T data "data/$out.unsorted" > "data/$out.tsv"
            rm -f "data/$out.unsorted" "data/$out.osm.pbf" "data/$out.geojsonseq"
          done
          ls -l data/lamps.tsv data/signals.tsv

      # ---------------- speed limits and speed cameras (full builds and "extras only") ----------------
      - name: Build speed limit and speed camera lists
        if: matrix.part == 'lists' || matrix.part == 'extras'
        run: |
          # speed cameras: the same tile-sorted list as the traffic lights
          osmium tags-filter data/region.osm.pbf "n/highway=speed_camera" -o data/cams.osm.pbf --overwrite
          osmium export data/cams.osm.pbf -f geojsonseq --geometry-types=point -o data/cams.geojsonseq --overwrite
          python3 - <<'PY'
          import json, math
          n = 0
          with open("data/cams.geojsonseq", encoding="utf-8") as f, open("data/cameras.unsorted", "w") as o:
              for line in f:
                  line = line.lstrip("\x1e").strip()
                  if not line: continue
                  try:
                      ft = json.loads(line); lon, lat = ft["geometry"]["coordinates"]
                  except Exception: continue
                  # which way the camera checks traffic, in degrees, when it's mapped (a 4th column; blank when not known)
                  pr = ft.get("properties") or {}
                  dv = str(pr.get("direction") or pr.get("camera:direction") or "").strip().upper()
                  card = {"N":0,"NNE":22.5,"NE":45,"ENE":67.5,"E":90,"ESE":112.5,"SE":135,"SSE":157.5,"S":180,"SSW":202.5,"SW":225,"WSW":247.5,"W":270,"WNW":292.5,"NW":315,"NNW":337.5}
                  d = ""
                  if dv and ";" not in dv:
                      if dv in card: d = "%g" % card[dv]
                      else:
                          try: d = "%g" % (float(dv) % 360.0)
                          except ValueError: d = ""
                  x = min(32767, max(0, int((lon + 180.0) / 360.0 * 32768)))
                  r = math.radians(lat)
                  y = min(32767, max(0, int((1.0 - math.log(math.tan(r) + 1.0 / math.cos(r)) / math.pi) / 2.0 * 32768)))
                  o.write("%05d%05d\t%.6f\t%.6f\t%s\n" % (y, x, lat, lon, d)); n += 1
          print("cameras", n)
          PY
          LC_ALL=C sort -S 1G -T data data/cameras.unsorted > data/cameras.tsv
          rm -f data/cameras.unsorted data/cams.osm.pbf data/cams.geojsonseq
          # every road a car can use, with its speed limit tags and shape, grouped by zoom-14 tile (see OfflineLimits.kt in the app)
          osmium tags-filter data/region.osm.pbf w/highway=motorway,motorway_link,trunk,trunk_link,primary,primary_link,secondary,secondary_link,tertiary,tertiary_link,unclassified,residential,living_street,service,road -o data/roads.osm.pbf --overwrite
          osmium export data/roads.osm.pbf -f geojsonseq --geometry-types=linestring --add-unique-id=type_id -o data/roads.geojsonseq --overwrite
          rm -f data/roads.osm.pbf
          python3 - <<'PY'
          import json, math, base64
          HW = ["motorway","motorway_link","trunk","trunk_link","primary","primary_link","secondary","secondary_link","tertiary","tertiary_link","unclassified","residential","living_street","service","road"]
          HI = {h: i for i, h in enumerate(HW)}
          Z = 16384
          def tile(lat, lon):
              x = min(Z - 1, max(0, int((lon + 180.0) / 360.0 * Z)))
              r = math.radians(max(-85.0, min(85.0, lat)))
              y = min(Z - 1, max(0, int((1.0 - math.log(math.tan(r) + 1.0 / math.cos(r)) / math.pi) / 2.0 * Z)))
              return y * Z + x
          def uv(n, out):
              while True:
                  b = n & 0x7f; n >>= 7
                  if n: out.append(b | 0x80)
                  else: out.append(b); return
          def zz(n): return (n << 1) ^ (n >> 63)
          def st(s, out):
              b = str(s or "").replace("\t", " ").encode("utf-8")[:255]
              uv(len(b), out); out.extend(b)
          n = 0
          with open("data/roads.geojsonseq", encoding="utf-8") as f, open("data/limits.unsorted", "w") as o:
              for line in f:
                  line = line.lstrip("\x1e").strip()
                  if not line: continue
                  try: ft = json.loads(line)
                  except Exception: continue
                  g = ft.get("geometry") or {}
                  if g.get("type") != "LineString": continue
                  pr = ft.get("properties") or {}
                  hw = pr.get("highway")
                  if hw not in HI: continue
                  # driveways and car park aisles are left out (they only get in the way of matching the road you're on)
                  if hw == "service" and pr.get("service") and not pr.get("maxspeed"): continue
                  c = g.get("coordinates") or []
                  if len(c) < 2: continue
                  fid = str(ft.get("id", "w0"))
                  wid = int(fid[1:]) if fid[1:].isdigit() else 0
                  ow = str(pr.get("oneway", "")).lower(); jn = str(pr.get("junction", "")).lower()
                  flags = (1 if ow in ("yes", "true", "1") else 0) | (2 if ow == "-1" else 0) | (4 if jn in ("roundabout", "circular") else 0)
                  mt = pr.get("maxspeed:type") or pr.get("source:maxspeed") or pr.get("zone:maxspeed") or ""
                  pts = [(int(round(p[1] * 1e5)), int(round(p[0] * 1e5))) for p in c]
                  dd = [pts[0]]
                  for q in pts[1:]:
                      if q != dd[-1]: dd.append(q)
                  if len(dd) < 2: continue
                  rec = bytearray([HI[hw], flags]); uv(wid, rec)
                  for s in (pr.get("name"), pr.get("ref"), pr.get("maxspeed"), mt, pr.get("maxspeed:forward"), pr.get("maxspeed:backward")): st(s, rec)
                  uv(len(dd), rec); uv(dd[0][0] + 9000000, rec); uv(dd[0][1] + 18000000, rec)
                  for i in range(1, len(dd)):
                      uv(zz(dd[i][0] - dd[i - 1][0]), rec); uv(zz(dd[i][1] - dd[i - 1][1]), rec)
                  keys = set()
                  for i in range(len(c) - 1):
                      a = c[i]; b = c[i + 1]
                      dy = (b[1] - a[1]) * 111320.0; dx = (b[0] - a[0]) * 111320.0 * math.cos(math.radians(a[1]))
                      steps = int(math.hypot(dx, dy) / 100.0) + 1
                      for k in range(steps + 1):
                          t = k / steps
                          keys.add(tile(a[1] + (b[1] - a[1]) * t, a[0] + (b[0] - a[0]) * t))
                  enc = base64.b64encode(bytes(rec)).decode()
                  for k in keys: o.write("%09d\t%s\n" % (k, enc))
                  n += 1
          print("roads", n)
          PY
          rm -f data/roads.geojsonseq
          LC_ALL=C sort -S 3G -T data data/limits.unsorted > data/limits.sorted
          rm -f data/limits.unsorted
          python3 - <<'PY'
          import base64, zlib, struct
          def uv(n, out):
              while True:
                  b = n & 0x7f; n >>= 7
                  if n: out.append(b | 0x80)
                  else: out.append(b); return
          idx = []; state = {"off": 0, "cur": None, "recs": []}
          def flush(o):
              if state["cur"] is None: return
              blob = bytearray(); uv(len(state["recs"]), blob)
              for r in state["recs"]: blob.extend(r)
              z = zlib.compress(bytes(blob), 9)
              o.write(z); idx.append((state["cur"], state["off"], len(z))); state["off"] += len(z)
          with open("data/limits.sorted") as f, open("data/limits.blobs", "wb") as o:
              for line in f:
                  k, _, e = line.rstrip("\n").partition("\t")
                  k = int(k)
                  if k != state["cur"]:
                      flush(o); state["cur"] = k; state["recs"] = []
                  state["recs"].append(base64.b64decode(e))
              flush(o)
          with open("data/limits.bin", "wb") as o:
              o.write(b"HNL1"); o.write(struct.pack(">II", 14, len(idx)))
              for k, of, ln in idx: o.write(struct.pack(">III", k, of, ln))
              with open("data/limits.blobs", "rb") as b:
                  while True:
                      ch = b.read(1 << 20)
                      if not ch: break
                      o.write(ch)
          print("tiles", len(idx))
          PY
          rm -f data/limits.sorted data/limits.blobs
          ls -l data/cameras.tsv data/limits.bin

      # ---------------- publish ----------------
      - name: Publish to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f data/region.osm.pbf data/tz.sqlite
          # GitHub refuses release files of 2 GB or more, so a bigger file is cut into parts (the app joins them again)
          for big in tiles.tar map.pmtiles addresses.tsv places.tsv names.idx; do
            if [ -f "data/$big" ] && [ "$(stat -c%s data/$big)" -gt 1900000000 ]; then
              split -b 1800M -d -a 2 "data/$big" "data/$big.part" && rm "data/$big"
            fi
          done
          FILES=""
          for f in data/tiles.tar data/tiles.tar.part* data/admins.sqlite data/valhalla.json data/places.tsv data/places.tsv.part* data/names.idx data/names.idx.part* data/map.pmtiles data/map.pmtiles.part* data/fonts.zip data/addresses.tsv data/addresses.tsv.part* data/postcodes.tsv data/lamps.tsv data/signals.tsv data/cameras.tsv data/limits.bin; do
            # GitHub won't take an empty file (an area with no traffic lights mapped, say): the app copes without it
            [ -s "$f" ] && FILES="$FILES $f"
          done
          [ -n "$FILES" ] || { echo "Nothing to publish"; exit 1; }
          # (in "extras only" mode just the speed limit and camera files are here: the rest of the release is left as it is)
          ls -l $FILES
          gh release upload "${{ matrix.area.tag }}" $FILES --repo "${{ github.repository }}" --clobber
          echo "Download address: https://github.com/${{ github.repository }}/releases/download/${{ matrix.area.tag }}"

  build3:
    needs: [plan, sources]
    if: ${{ !cancelled() && needs.plan.outputs.a3 != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        area: ${{ fromJson(needs.plan.outputs.a3) }}
        part: ${{ fromJson(needs.plan.outputs.parts) }}
    name: ${{ matrix.area.tag }} ${{ matrix.part }}
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/.ghcup || true
          sudo docker image prune -af > /dev/null || true
          df -h /
      - name: Download the OpenStreetMap extract
        run: |
          # work on whichever disk has more room (big countries need tens of GB along the way)
          if [ -d /mnt ] && [ "$(df --output=avail /mnt | tail -1)" -gt "$(df --output=avail . | tail -1)" ]; then
            sudo mkdir -p /mnt/data && sudo chown "$USER" /mnt/data && ln -s /mnt/data data
          else
            mkdir -p data
          fi
          df -h . /mnt || true
          # lots of jobs start together, so spread their downloads out a little, and keep trying if the server is busy;
          # if Geofabrik won't give it, the same extract is fetched from the openstreetmap.fr mirror instead
          sleep $(( RANDOM % 90 ))
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          P="${{ matrix.area.path }}"
          # smaller areas that Geofabrik has no extract of their own for ("cut/<name>"): the bigger extract they're in is
          # downloaded and the area is cut out of it by its box (the pack then reaches a little over the border, which is fine)
          BBOX=""
          case "$P" in
            cut/singapore) P="asia/malaysia-singapore-brunei"; BBOX="103.55,1.13,104.13,1.50" ;;
            cut/brunei)    P="asia/malaysia-singapore-brunei"; BBOX="113.95,3.95,115.40,5.10" ;;
          esac
          ok=""
          for U in "https://download.geofabrik.de/$P-latest.osm.pbf" "https://download.openstreetmap.fr/extracts/$P.osm.pbf"; do
            for try in 1 2 3 4 5 6; do
              echo "Downloading $U (try $try)"
              if curl -fL --retry 3 --retry-all-errors --retry-delay 30 --connect-timeout 30 -A "HorizonNav-pack-builder" -o data/region.osm.pbf "$U" \
                 && [ "$(stat -c%s data/region.osm.pbf)" -gt 10000 ]; then ok=1; break; fi
              rm -f data/region.osm.pbf
              sleep $(( 60 * try ))
            done
            [ -n "$ok" ] && break
          done
          [ -n "$ok" ] || { echo "Couldn't download $P from Geofabrik or the mirror - check the path on download.geofabrik.de"; exit 1; }
          if [ -n "$BBOX" ]; then
            echo "Cutting out $BBOX"
            osmium extract -b "$BBOX" --strategy=complete_ways data/region.osm.pbf -o data/cut.osm.pbf --overwrite
            mv data/cut.osm.pbf data/region.osm.pbf
          fi
          ls -l data

      # ---------------- routing ----------------
      - name: Build the routing tiles with Valhalla
        if: matrix.part == 'routing'
        run: |
          docker run --rm -v "$PWD/data:/data" --entrypoint /bin/bash ghcr.io/valhalla/valhalla:latest -c '
            set -e
            cd /data
            valhalla_build_config --mjolnir-tile-dir /data/tiles --mjolnir-tile-extract /data/tiles.tar --mjolnir-timezone /data/tz.sqlite --mjolnir-admin /data/admins.sqlite > valhalla.json
            valhalla_build_timezones > tz.sqlite
            valhalla_build_admins -c valhalla.json region.osm.pbf
            valhalla_build_tiles -c valhalla.json region.osm.pbf
            valhalla_build_extract -c valhalla.json -v
            rm -rf /data/tiles
          '
          sudo chown -R "$USER" data
          ls -l data

      # ---------------- map ----------------
      - name: Fetch the map's shared source files from this repo
        if: matrix.part == 'map'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # (kept by the "sources" job; anything missing is downloaded by planetiler itself as before)
          mkdir -p data/sources
          for n in water-polygons-split-3857.zip natural_earth_vector.sqlite.zip lake_centerline.shp.zip; do
            for try in 1 2 3; do
              gh release download planetiler-sources --repo "${{ github.repository }}" -p "$n" -D data/sources --clobber && break
              sleep $(( 30 * try ))
            done
          done
          # the coastline and sea file still missing (its server has been refusing GitHub at times): the map is built without the
          # sea rather than not at all (a pack only shows as ready with its map). Inland it looks the same; on the coast the sea
          # shows in the land colour until the map is rebuilt ("map only") once the file can be fetched again
          W=data/sources/water-polygons-split-3857.zip
          if [ ! -s "$W" ]; then
            curl -fL --connect-timeout 20 --max-time 1800 -A "HorizonNav-pack-builder" -o "$W" https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip || rm -f "$W"
          fi
          if [ ! -s "$W" ] || [ "$(stat -c%s "$W")" -lt 1000000 ]; then
            echo "::warning::No coastline and sea file: building this map without the sea. Run it again with mode 'map only' once the file is in the planetiler-sources release."
            python3 - "$W" <<'PY'
          # an empty shapefile (no shapes) in the same layout as the real file, so the map build carries on without the sea
          import struct, sys, zipfile, io
          def header(words):
              return struct.pack(">7i", 9994, 0, 0, 0, 0, 0, words) + struct.pack("<2i", 1000, 5) + struct.pack("<8d", 0, 0, 0, 0, 0, 0, 0, 0)
          shp = header(50); shx = header(50)
          dbf = struct.pack("<4BIHH20x", 3, 126, 1, 1, 0, 32 + 32 + 1, 11) + b"x".ljust(11, b"\0") + b"N" + b"\0" * 4 + bytes([10, 0]) + b"\0" * 14 + b"\r" + b"\x1a"
          prj = b'PROJCS["WGS 84 / Pseudo-Mercator",GEOGCS["WGS 84",DATUM["WGS_1984",SPHEROID["WGS 84",6378137,298.257223563]],PRIMEM["Greenwich",0],UNIT["degree",0.0174532925199433]],PROJECTION["Mercator_1SP"],PARAMETER["central_meridian",0],PARAMETER["scale_factor",1],PARAMETER["false_easting",0],PARAMETER["false_northing",0],UNIT["metre",1]]'
          with zipfile.ZipFile(sys.argv[1], "w") as z:
              for ext, data in (("shp", shp), ("shx", shx), ("dbf", dbf), ("prj", prj)):
                  z.writestr("water-polygons-split-3857/water_polygons." + ext, data)
          PY
          fi
          ls -l data/sources || true
      - name: Build the offline map (planetiler)
        if: matrix.part == 'map'
        run: |
          MEM=$(( $(free -g | awk '/Mem:/{print $2}') - 3 ))
          docker run --rm -e JAVA_TOOL_OPTIONS="-Xmx${MEM}g" -v "$PWD/data:/data" ghcr.io/onthegomap/planetiler:latest \
            --osm-path=/data/region.osm.pbf --output=/data/map.pmtiles --download --download_dir=/data/sources \
            --force --maxzoom=14 --fetch-wikidata=false --storage=mmap
          sudo chown -R "$USER" data
          rm -rf data/sources
          ls -l data/map.pmtiles
      - name: Fonts for the map labels
        if: matrix.part == 'map'
        run: |
          curl -fL -o fonts-src.zip https://github.com/openmaptiles/fonts/releases/download/v2.0/v2.0.zip
          mkdir -p fsrc fontout
          unzip -q fonts-src.zip -d fsrc
          for f in "Noto Sans Regular" "Noto Sans Bold"; do
            d=$(find fsrc -type d -name "$f" | head -1)
            echo "$f -> $d"
            cp -r "$d" "fontout/$(echo "$f" | tr -d ' ')"
          done
          (cd fontout && zip -qr ../data/fonts.zip .)
          ls -l data/fonts.zip

      # ---------------- search lists, lamps and traffic lights ----------------
      - name: Build a search list of streets, shops and places
        if: matrix.part == 'lists'
        run: |
          osmium tags-filter data/region.osm.pbf w/highway nwr/amenity nwr/shop nwr/tourism nwr/leisure nwr/office nwr/railway=station nwr/place -o data/named.osm.pbf --overwrite
          osmium export data/named.osm.pbf -f geojsonseq --geometry-types=point,linestring,polygon -o data/named.geojsonseq --overwrite
          rm -f data/named.osm.pbf
          python3 - <<'PY'
          import json
          roads = {"motorway","trunk","primary","secondary","tertiary","unclassified","residential","living_street","pedestrian","road","motorway_link","trunk_link","primary_link","secondary_link"}
          seen = set(); n = 0
          def mid(g):
              c = g["coordinates"]
              if g["type"] == "Point": return c[1], c[0]
              if g["type"] == "LineString": p = c[len(c)//2]; return p[1], p[0]
              if g["type"] == "Polygon": p = c[0][0]; return p[1], p[0]
              return None
          with open("data/named.geojsonseq", encoding="utf-8") as f, open("data/places.tsv", "w", encoding="utf-8") as out:
              for line in f:
                  line = line.strip().lstrip("\x1e")
                  if not line: continue
                  try: ft = json.loads(line)
                  except Exception: continue
                  pr = ft.get("properties") or {}
                  name = (pr.get("name") or "").replace("\t", " ").strip()
                  if not name or not ft.get("geometry"): continue
                  hw = pr.get("highway")
                  if hw:
                      if hw not in roads: continue
                      kind = "Street"
                  else:
                      kind = None
                      for k in ("place", "amenity", "shop", "tourism", "leisure", "office", "railway"):
                          if pr.get(k): kind = pr[k].replace("_", " ").capitalize(); break
                      if kind is None: continue
                  m = mid(ft["geometry"])
                  if not m: continue
                  key = hash((name.lower(), kind, round(m[0], 2), round(m[1], 2)))
                  if key in seen: continue
                  seen.add(key)
                  out.write("%s\t%s\t%.5f\t%.5f\n" % (name, kind, m[0], m[1])); n += 1
          print("places written:", n)
          PY
          rm -f data/named.geojsonseq
          ls -l data/places.tsv
          # a word index for the search list: every word of every name with where its line starts in places.tsv, sorted, so the
          # app can find names by their first letters without reading the whole list
          python3 - <<'PY'
          import re
          wre = re.compile(r"[^\w]+")
          n = 0
          with open("data/places.tsv", "rb") as f, open("data/names.unsorted", "w", encoding="utf-8") as o:
              off = 0
              for raw in f:
                  name = raw.decode("utf-8", "replace").split("\t", 1)[0].lower()
                  for w in set(x for x in wre.split(name) if len(x) >= 2):
                      o.write("%s\t%d\n" % (w, off)); n += 1
                  off += len(raw)
          print("index entries:", n)
          PY
          LC_ALL=C sort -S 3G -T data data/names.unsorted > data/names.idx
          rm -f data/names.unsorted
          ls -l data/names.idx
      - name: Build house number and postcode lists
        if: matrix.part == 'lists'
        run: |
          osmium tags-filter data/region.osm.pbf nwr/addr:housenumber -o data/addr.osm.pbf --overwrite
          osmium export data/addr.osm.pbf -f geojsonseq --geometry-types=point,polygon -o data/addr.geojsonseq --overwrite
          rm -f data/addr.osm.pbf
          python3 - <<'PY'
          import json
          seen = set(); pcs = {}; n = 0
          def pt(g):
              c = g["coordinates"]
              if g["type"] == "Point": return c[1], c[0]
              if g["type"] == "Polygon":
                  r = c[0]; k = len(r) - 1 if len(r) > 1 else 1
                  return sum(p[1] for p in r[:k]) / k, sum(p[0] for p in r[:k]) / k
              return None
          def key(s): return "".join(ch.lower() if ch < "\x80" else ch for ch in s)
          with open("data/addr.geojsonseq", encoding="utf-8") as f, open("data/addr.unsorted", "w", encoding="utf-8") as out:
              for line in f:
                  line = line.strip().lstrip("\x1e")
                  if not line: continue
                  try: ft = json.loads(line)
                  except Exception: continue
                  pr = ft.get("properties") or {}
                  num = (pr.get("addr:housenumber") or "").replace("\t", " ").strip()
                  street = (pr.get("addr:street") or pr.get("addr:place") or "").replace("\t", " ").strip()
                  if not num or not street or not ft.get("geometry"): continue
                  p = pt(ft["geometry"])
                  if not p: continue
                  pc = (pr.get("addr:postcode") or "").replace("\t", " ").strip().upper()
                  h = hash((key(street), num.lower(), round(p[0], 4), round(p[1], 4)))
                  if h in seen: continue
                  seen.add(h)
                  out.write("%s\t%s\t%s\t%.5f\t%.5f\t%s\n" % (key(street), street, num, p[0], p[1], pc)); n += 1
                  if pc:
                      a = pcs.get(pc)
                      if a: a[0] += p[0]; a[1] += p[1]; a[2] += 1
                      else: pcs[pc] = [p[0], p[1], 1]
          with open("data/postcodes.tsv", "w", encoding="utf-8") as o:
              for pc in sorted(pcs, key=lambda x: x.replace(" ", "")):
                  a = pcs[pc]
                  o.write("%s\t%s\t%.5f\t%.5f\n" % (pc.replace(" ", "").lower(), pc, a[0] / a[2], a[1] / a[2]))
          print("addresses:", n, "postcodes:", len(pcs))
          PY
          rm -f data/addr.geojsonseq
          LC_ALL=C sort -S 4G -T data -t "$(printf '\t')" -k1,1 data/addr.unsorted | cut -f2- > data/addresses.tsv
          rm -f data/addr.unsorted
          ls -l data/addresses.tsv data/postcodes.tsv
      - name: Build street lamp and traffic light lists
        if: matrix.part == 'lists'
        run: |
          for kind in street_lamp:lamps traffic_signals:signals; do
            tag="${kind%%:*}"; out="${kind##*:}"
            osmium tags-filter data/region.osm.pbf "n/highway=$tag" -o "data/$out.osm.pbf" --overwrite
            osmium export "data/$out.osm.pbf" -f geojsonseq --geometry-types=point -o "data/$out.geojsonseq" --overwrite
            python3 - "$out" <<'PY'
          import json, math, sys
          name = sys.argv[1]; n = 0
          with open("data/%s.geojsonseq" % name, encoding="utf-8") as f, open("data/%s.unsorted" % name, "w") as o:
              for line in f:
                  line = line.lstrip("\x1e").strip()
                  if not line: continue
                  try: lon, lat = json.loads(line)["geometry"]["coordinates"]
                  except Exception: continue
                  x = min(32767, max(0, int((lon + 180.0) / 360.0 * 32768)))
                  r = math.radians(lat)
                  y = min(32767, max(0, int((1.0 - math.log(math.tan(r) + 1.0 / math.cos(r)) / math.pi) / 2.0 * 32768)))
                  o.write("%05d%05d\t%.6f\t%.6f\n" % (y, x, lat, lon)); n += 1
          print(name, n)
          PY
            LC_ALL=C sort -S 1G -T data "data/$out.unsorted" > "data/$out.tsv"
            rm -f "data/$out.unsorted" "data/$out.osm.pbf" "data/$out.geojsonseq"
          done
          ls -l data/lamps.tsv data/signals.tsv

      # ---------------- speed limits and speed cameras (full builds and "extras only") ----------------
      - name: Build speed limit and speed camera lists
        if: matrix.part == 'lists' || matrix.part == 'extras'
        run: |
          # speed cameras: the same tile-sorted list as the traffic lights
          osmium tags-filter data/region.osm.pbf "n/highway=speed_camera" -o data/cams.osm.pbf --overwrite
          osmium export data/cams.osm.pbf -f geojsonseq --geometry-types=point -o data/cams.geojsonseq --overwrite
          python3 - <<'PY'
          import json, math
          n = 0
          with open("data/cams.geojsonseq", encoding="utf-8") as f, open("data/cameras.unsorted", "w") as o:
              for line in f:
                  line = line.lstrip("\x1e").strip()
                  if not line: continue
                  try:
                      ft = json.loads(line); lon, lat = ft["geometry"]["coordinates"]
                  except Exception: continue
                  # which way the camera checks traffic, in degrees, when it's mapped (a 4th column; blank when not known)
                  pr = ft.get("properties") or {}
                  dv = str(pr.get("direction") or pr.get("camera:direction") or "").strip().upper()
                  card = {"N":0,"NNE":22.5,"NE":45,"ENE":67.5,"E":90,"ESE":112.5,"SE":135,"SSE":157.5,"S":180,"SSW":202.5,"SW":225,"WSW":247.5,"W":270,"WNW":292.5,"NW":315,"NNW":337.5}
                  d = ""
                  if dv and ";" not in dv:
                      if dv in card: d = "%g" % card[dv]
                      else:
                          try: d = "%g" % (float(dv) % 360.0)
                          except ValueError: d = ""
                  x = min(32767, max(0, int((lon + 180.0) / 360.0 * 32768)))
                  r = math.radians(lat)
                  y = min(32767, max(0, int((1.0 - math.log(math.tan(r) + 1.0 / math.cos(r)) / math.pi) / 2.0 * 32768)))
                  o.write("%05d%05d\t%.6f\t%.6f\t%s\n" % (y, x, lat, lon, d)); n += 1
          print("cameras", n)
          PY
          LC_ALL=C sort -S 1G -T data data/cameras.unsorted > data/cameras.tsv
          rm -f data/cameras.unsorted data/cams.osm.pbf data/cams.geojsonseq
          # every road a car can use, with its speed limit tags and shape, grouped by zoom-14 tile (see OfflineLimits.kt in the app)
          osmium tags-filter data/region.osm.pbf w/highway=motorway,motorway_link,trunk,trunk_link,primary,primary_link,secondary,secondary_link,tertiary,tertiary_link,unclassified,residential,living_street,service,road -o data/roads.osm.pbf --overwrite
          osmium export data/roads.osm.pbf -f geojsonseq --geometry-types=linestring --add-unique-id=type_id -o data/roads.geojsonseq --overwrite
          rm -f data/roads.osm.pbf
          python3 - <<'PY'
          import json, math, base64
          HW = ["motorway","motorway_link","trunk","trunk_link","primary","primary_link","secondary","secondary_link","tertiary","tertiary_link","unclassified","residential","living_street","service","road"]
          HI = {h: i for i, h in enumerate(HW)}
          Z = 16384
          def tile(lat, lon):
              x = min(Z - 1, max(0, int((lon + 180.0) / 360.0 * Z)))
              r = math.radians(max(-85.0, min(85.0, lat)))
              y = min(Z - 1, max(0, int((1.0 - math.log(math.tan(r) + 1.0 / math.cos(r)) / math.pi) / 2.0 * Z)))
              return y * Z + x
          def uv(n, out):
              while True:
                  b = n & 0x7f; n >>= 7
                  if n: out.append(b | 0x80)
                  else: out.append(b); return
          def zz(n): return (n << 1) ^ (n >> 63)
          def st(s, out):
              b = str(s or "").replace("\t", " ").encode("utf-8")[:255]
              uv(len(b), out); out.extend(b)
          n = 0
          with open("data/roads.geojsonseq", encoding="utf-8") as f, open("data/limits.unsorted", "w") as o:
              for line in f:
                  line = line.lstrip("\x1e").strip()
                  if not line: continue
                  try: ft = json.loads(line)
                  except Exception: continue
                  g = ft.get("geometry") or {}
                  if g.get("type") != "LineString": continue
                  pr = ft.get("properties") or {}
                  hw = pr.get("highway")
                  if hw not in HI: continue
                  # driveways and car park aisles are left out (they only get in the way of matching the road you're on)
                  if hw == "service" and pr.get("service") and not pr.get("maxspeed"): continue
                  c = g.get("coordinates") or []
                  if len(c) < 2: continue
                  fid = str(ft.get("id", "w0"))
                  wid = int(fid[1:]) if fid[1:].isdigit() else 0
                  ow = str(pr.get("oneway", "")).lower(); jn = str(pr.get("junction", "")).lower()
                  flags = (1 if ow in ("yes", "true", "1") else 0) | (2 if ow == "-1" else 0) | (4 if jn in ("roundabout", "circular") else 0)
                  mt = pr.get("maxspeed:type") or pr.get("source:maxspeed") or pr.get("zone:maxspeed") or ""
                  pts = [(int(round(p[1] * 1e5)), int(round(p[0] * 1e5))) for p in c]
                  dd = [pts[0]]
                  for q in pts[1:]:
                      if q != dd[-1]: dd.append(q)
                  if len(dd) < 2: continue
                  rec = bytearray([HI[hw], flags]); uv(wid, rec)
                  for s in (pr.get("name"), pr.get("ref"), pr.get("maxspeed"), mt, pr.get("maxspeed:forward"), pr.get("maxspeed:backward")): st(s, rec)
                  uv(len(dd), rec); uv(dd[0][0] + 9000000, rec); uv(dd[0][1] + 18000000, rec)
                  for i in range(1, len(dd)):
                      uv(zz(dd[i][0] - dd[i - 1][0]), rec); uv(zz(dd[i][1] - dd[i - 1][1]), rec)
                  keys = set()
                  for i in range(len(c) - 1):
                      a = c[i]; b = c[i + 1]
                      dy = (b[1] - a[1]) * 111320.0; dx = (b[0] - a[0]) * 111320.0 * math.cos(math.radians(a[1]))
                      steps = int(math.hypot(dx, dy) / 100.0) + 1
                      for k in range(steps + 1):
                          t = k / steps
                          keys.add(tile(a[1] + (b[1] - a[1]) * t, a[0] + (b[0] - a[0]) * t))
                  enc = base64.b64encode(bytes(rec)).decode()
                  for k in keys: o.write("%09d\t%s\n" % (k, enc))
                  n += 1
          print("roads", n)
          PY
          rm -f data/roads.geojsonseq
          LC_ALL=C sort -S 3G -T data data/limits.unsorted > data/limits.sorted
          rm -f data/limits.unsorted
          python3 - <<'PY'
          import base64, zlib, struct
          def uv(n, out):
              while True:
                  b = n & 0x7f; n >>= 7
                  if n: out.append(b | 0x80)
                  else: out.append(b); return
          idx = []; state = {"off": 0, "cur": None, "recs": []}
          def flush(o):
              if state["cur"] is None: return
              blob = bytearray(); uv(len(state["recs"]), blob)
              for r in state["recs"]: blob.extend(r)
              z = zlib.compress(bytes(blob), 9)
              o.write(z); idx.append((state["cur"], state["off"], len(z))); state["off"] += len(z)
          with open("data/limits.sorted") as f, open("data/limits.blobs", "wb") as o:
              for line in f:
                  k, _, e = line.rstrip("\n").partition("\t")
                  k = int(k)
                  if k != state["cur"]:
                      flush(o); state["cur"] = k; state["recs"] = []
                  state["recs"].append(base64.b64decode(e))
              flush(o)
          with open("data/limits.bin", "wb") as o:
              o.write(b"HNL1"); o.write(struct.pack(">II", 14, len(idx)))
              for k, of, ln in idx: o.write(struct.pack(">III", k, of, ln))
              with open("data/limits.blobs", "rb") as b:
                  while True:
                      ch = b.read(1 << 20)
                      if not ch: break
                      o.write(ch)
          print("tiles", len(idx))
          PY
          rm -f data/limits.sorted data/limits.blobs
          ls -l data/cameras.tsv data/limits.bin

      # ---------------- publish ----------------
      - name: Publish to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f data/region.osm.pbf data/tz.sqlite
          # GitHub refuses release files of 2 GB or more, so a bigger file is cut into parts (the app joins them again)
          for big in tiles.tar map.pmtiles addresses.tsv places.tsv names.idx; do
            if [ -f "data/$big" ] && [ "$(stat -c%s data/$big)" -gt 1900000000 ]; then
              split -b 1800M -d -a 2 "data/$big" "data/$big.part" && rm "data/$big"
            fi
          done
          FILES=""
          for f in data/tiles.tar data/tiles.tar.part* data/admins.sqlite data/valhalla.json data/places.tsv data/places.tsv.part* data/names.idx data/names.idx.part* data/map.pmtiles data/map.pmtiles.part* data/fonts.zip data/addresses.tsv data/addresses.tsv.part* data/postcodes.tsv data/lamps.tsv data/signals.tsv data/cameras.tsv data/limits.bin; do
            # GitHub won't take an empty file (an area with no traffic lights mapped, say): the app copes without it
            [ -s "$f" ] && FILES="$FILES $f"
          done
          [ -n "$FILES" ] || { echo "Nothing to publish"; exit 1; }
          # (in "extras only" mode just the speed limit and camera files are here: the rest of the release is left as it is)
          ls -l $FILES
          gh release upload "${{ matrix.area.tag }}" $FILES --repo "${{ github.repository }}" --clobber
          echo "Download address: https://github.com/${{ github.repository }}/releases/download/${{ matrix.area.tag }}"

  build4:
    needs: [plan, sources]
    if: ${{ !cancelled() && needs.plan.outputs.a4 != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        area: ${{ fromJson(needs.plan.outputs.a4) }}
        part: ${{ fromJson(needs.plan.outputs.parts) }}
    name: ${{ matrix.area.tag }} ${{ matrix.part }}
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/.ghcup || true
          sudo docker image prune -af > /dev/null || true
          df -h /
      - name: Download the OpenStreetMap extract
        run: |
          # work on whichever disk has more room (big countries need tens of GB along the way)
          if [ -d /mnt ] && [ "$(df --output=avail /mnt | tail -1)" -gt "$(df --output=avail . | tail -1)" ]; then
            sudo mkdir -p /mnt/data && sudo chown "$USER" /mnt/data && ln -s /mnt/data data
          else
            mkdir -p data
          fi
          df -h . /mnt || true
          # lots of jobs start together, so spread their downloads out a little, and keep trying if the server is busy;
          # if Geofabrik won't give it, the same extract is fetched from the openstreetmap.fr mirror instead
          sleep $(( RANDOM % 90 ))
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          P="${{ matrix.area.path }}"
          # smaller areas that Geofabrik has no extract of their own for ("cut/<name>"): the bigger extract they're in is
          # downloaded and the area is cut out of it by its box (the pack then reaches a little over the border, which is fine)
          BBOX=""
          case "$P" in
            cut/singapore) P="asia/malaysia-singapore-brunei"; BBOX="103.55,1.13,104.13,1.50" ;;
            cut/brunei)    P="asia/malaysia-singapore-brunei"; BBOX="113.95,3.95,115.40,5.10" ;;
          esac
          ok=""
          for U in "https://download.geofabrik.de/$P-latest.osm.pbf" "https://download.openstreetmap.fr/extracts/$P.osm.pbf"; do
            for try in 1 2 3 4 5 6; do
              echo "Downloading $U (try $try)"
              if curl -fL --retry 3 --retry-all-errors --retry-delay 30 --connect-timeout 30 -A "HorizonNav-pack-builder" -o data/region.osm.pbf "$U" \
                 && [ "$(stat -c%s data/region.osm.pbf)" -gt 10000 ]; then ok=1; break; fi
              rm -f data/region.osm.pbf
              sleep $(( 60 * try ))
            done
            [ -n "$ok" ] && break
          done
          [ -n "$ok" ] || { echo "Couldn't download $P from Geofabrik or the mirror - check the path on download.geofabrik.de"; exit 1; }
          if [ -n "$BBOX" ]; then
            echo "Cutting out $BBOX"
            osmium extract -b "$BBOX" --strategy=complete_ways data/region.osm.pbf -o data/cut.osm.pbf --overwrite
            mv data/cut.osm.pbf data/region.osm.pbf
          fi
          ls -l data

      # ---------------- routing ----------------
      - name: Build the routing tiles with Valhalla
        if: matrix.part == 'routing'
        run: |
          docker run --rm -v "$PWD/data:/data" --entrypoint /bin/bash ghcr.io/valhalla/valhalla:latest -c '
            set -e
            cd /data
            valhalla_build_config --mjolnir-tile-dir /data/tiles --mjolnir-tile-extract /data/tiles.tar --mjolnir-timezone /data/tz.sqlite --mjolnir-admin /data/admins.sqlite > valhalla.json
            valhalla_build_timezones > tz.sqlite
            valhalla_build_admins -c valhalla.json region.osm.pbf
            valhalla_build_tiles -c valhalla.json region.osm.pbf
            valhalla_build_extract -c valhalla.json -v
            rm -rf /data/tiles
          '
          sudo chown -R "$USER" data
          ls -l data

      # ---------------- map ----------------
      - name: Fetch the map's shared source files from this repo
        if: matrix.part == 'map'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # (kept by the "sources" job; anything missing is downloaded by planetiler itself as before)
          mkdir -p data/sources
          for n in water-polygons-split-3857.zip natural_earth_vector.sqlite.zip lake_centerline.shp.zip; do
            for try in 1 2 3; do
              gh release download planetiler-sources --repo "${{ github.repository }}" -p "$n" -D data/sources --clobber && break
              sleep $(( 30 * try ))
            done
          done
          # the coastline and sea file still missing (its server has been refusing GitHub at times): the map is built without the
          # sea rather than not at all (a pack only shows as ready with its map). Inland it looks the same; on the coast the sea
          # shows in the land colour until the map is rebuilt ("map only") once the file can be fetched again
          W=data/sources/water-polygons-split-3857.zip
          if [ ! -s "$W" ]; then
            curl -fL --connect-timeout 20 --max-time 1800 -A "HorizonNav-pack-builder" -o "$W" https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip || rm -f "$W"
          fi
          if [ ! -s "$W" ] || [ "$(stat -c%s "$W")" -lt 1000000 ]; then
            echo "::warning::No coastline and sea file: building this map without the sea. Run it again with mode 'map only' once the file is in the planetiler-sources release."
            python3 - "$W" <<'PY'
          # an empty shapefile (no shapes) in the same layout as the real file, so the map build carries on without the sea
          import struct, sys, zipfile, io
          def header(words):
              return struct.pack(">7i", 9994, 0, 0, 0, 0, 0, words) + struct.pack("<2i", 1000, 5) + struct.pack("<8d", 0, 0, 0, 0, 0, 0, 0, 0)
          shp = header(50); shx = header(50)
          dbf = struct.pack("<4BIHH20x", 3, 126, 1, 1, 0, 32 + 32 + 1, 11) + b"x".ljust(11, b"\0") + b"N" + b"\0" * 4 + bytes([10, 0]) + b"\0" * 14 + b"\r" + b"\x1a"
          prj = b'PROJCS["WGS 84 / Pseudo-Mercator",GEOGCS["WGS 84",DATUM["WGS_1984",SPHEROID["WGS 84",6378137,298.257223563]],PRIMEM["Greenwich",0],UNIT["degree",0.0174532925199433]],PROJECTION["Mercator_1SP"],PARAMETER["central_meridian",0],PARAMETER["scale_factor",1],PARAMETER["false_easting",0],PARAMETER["false_northing",0],UNIT["metre",1]]'
          with zipfile.ZipFile(sys.argv[1], "w") as z:
              for ext, data in (("shp", shp), ("shx", shx), ("dbf", dbf), ("prj", prj)):
                  z.writestr("water-polygons-split-3857/water_polygons." + ext, data)
          PY
          fi
          ls -l data/sources || true
      - name: Build the offline map (planetiler)
        if: matrix.part == 'map'
        run: |
          MEM=$(( $(free -g | awk '/Mem:/{print $2}') - 3 ))
          docker run --rm -e JAVA_TOOL_OPTIONS="-Xmx${MEM}g" -v "$PWD/data:/data" ghcr.io/onthegomap/planetiler:latest \
            --osm-path=/data/region.osm.pbf --output=/data/map.pmtiles --download --download_dir=/data/sources \
            --force --maxzoom=14 --fetch-wikidata=false --storage=mmap
          sudo chown -R "$USER" data
          rm -rf data/sources
          ls -l data/map.pmtiles
      - name: Fonts for the map labels
        if: matrix.part == 'map'
        run: |
          curl -fL -o fonts-src.zip https://github.com/openmaptiles/fonts/releases/download/v2.0/v2.0.zip
          mkdir -p fsrc fontout
          unzip -q fonts-src.zip -d fsrc
          for f in "Noto Sans Regular" "Noto Sans Bold"; do
            d=$(find fsrc -type d -name "$f" | head -1)
            echo "$f -> $d"
            cp -r "$d" "fontout/$(echo "$f" | tr -d ' ')"
          done
          (cd fontout && zip -qr ../data/fonts.zip .)
          ls -l data/fonts.zip

      # ---------------- search lists, lamps and traffic lights ----------------
      - name: Build a search list of streets, shops and places
        if: matrix.part == 'lists'
        run: |
          osmium tags-filter data/region.osm.pbf w/highway nwr/amenity nwr/shop nwr/tourism nwr/leisure nwr/office nwr/railway=station nwr/place -o data/named.osm.pbf --overwrite
          osmium export data/named.osm.pbf -f geojsonseq --geometry-types=point,linestring,polygon -o data/named.geojsonseq --overwrite
          rm -f data/named.osm.pbf
          python3 - <<'PY'
          import json
          roads = {"motorway","trunk","primary","secondary","tertiary","unclassified","residential","living_street","pedestrian","road","motorway_link","trunk_link","primary_link","secondary_link"}
          seen = set(); n = 0
          def mid(g):
              c = g["coordinates"]
              if g["type"] == "Point": return c[1], c[0]
              if g["type"] == "LineString": p = c[len(c)//2]; return p[1], p[0]
              if g["type"] == "Polygon": p = c[0][0]; return p[1], p[0]
              return None
          with open("data/named.geojsonseq", encoding="utf-8") as f, open("data/places.tsv", "w", encoding="utf-8") as out:
              for line in f:
                  line = line.strip().lstrip("\x1e")
                  if not line: continue
                  try: ft = json.loads(line)
                  except Exception: continue
                  pr = ft.get("properties") or {}
                  name = (pr.get("name") or "").replace("\t", " ").strip()
                  if not name or not ft.get("geometry"): continue
                  hw = pr.get("highway")
                  if hw:
                      if hw not in roads: continue
                      kind = "Street"
                  else:
                      kind = None
                      for k in ("place", "amenity", "shop", "tourism", "leisure", "office", "railway"):
                          if pr.get(k): kind = pr[k].replace("_", " ").capitalize(); break
                      if kind is None: continue
                  m = mid(ft["geometry"])
                  if not m: continue
                  key = hash((name.lower(), kind, round(m[0], 2), round(m[1], 2)))
                  if key in seen: continue
                  seen.add(key)
                  out.write("%s\t%s\t%.5f\t%.5f\n" % (name, kind, m[0], m[1])); n += 1
          print("places written:", n)
          PY
          rm -f data/named.geojsonseq
          ls -l data/places.tsv
          # a word index for the search list: every word of every name with where its line starts in places.tsv, sorted, so the
          # app can find names by their first letters without reading the whole list
          python3 - <<'PY'
          import re
          wre = re.compile(r"[^\w]+")
          n = 0
          with open("data/places.tsv", "rb") as f, open("data/names.unsorted", "w", encoding="utf-8") as o:
              off = 0
              for raw in f:
                  name = raw.decode("utf-8", "replace").split("\t", 1)[0].lower()
                  for w in set(x for x in wre.split(name) if len(x) >= 2):
                      o.write("%s\t%d\n" % (w, off)); n += 1
                  off += len(raw)
          print("index entries:", n)
          PY
          LC_ALL=C sort -S 3G -T data data/names.unsorted > data/names.idx
          rm -f data/names.unsorted
          ls -l data/names.idx
      - name: Build house number and postcode lists
        if: matrix.part == 'lists'
        run: |
          osmium tags-filter data/region.osm.pbf nwr/addr:housenumber -o data/addr.osm.pbf --overwrite
          osmium export data/addr.osm.pbf -f geojsonseq --geometry-types=point,polygon -o data/addr.geojsonseq --overwrite
          rm -f data/addr.osm.pbf
          python3 - <<'PY'
          import json
          seen = set(); pcs = {}; n = 0
          def pt(g):
              c = g["coordinates"]
              if g["type"] == "Point": return c[1], c[0]
              if g["type"] == "Polygon":
                  r = c[0]; k = len(r) - 1 if len(r) > 1 else 1
                  return sum(p[1] for p in r[:k]) / k, sum(p[0] for p in r[:k]) / k
              return None
          def key(s): return "".join(ch.lower() if ch < "\x80" else ch for ch in s)
          with open("data/addr.geojsonseq", encoding="utf-8") as f, open("data/addr.unsorted", "w", encoding="utf-8") as out:
              for line in f:
                  line = line.strip().lstrip("\x1e")
                  if not line: continue
                  try: ft = json.loads(line)
                  except Exception: continue
                  pr = ft.get("properties") or {}
                  num = (pr.get("addr:housenumber") or "").replace("\t", " ").strip()
                  street = (pr.get("addr:street") or pr.get("addr:place") or "").replace("\t", " ").strip()
                  if not num or not street or not ft.get("geometry"): continue
                  p = pt(ft["geometry"])
                  if not p: continue
                  pc = (pr.get("addr:postcode") or "").replace("\t", " ").strip().upper()
                  h = hash((key(street), num.lower(), round(p[0], 4), round(p[1], 4)))
                  if h in seen: continue
                  seen.add(h)
                  out.write("%s\t%s\t%s\t%.5f\t%.5f\t%s\n" % (key(street), street, num, p[0], p[1], pc)); n += 1
                  if pc:
                      a = pcs.get(pc)
                      if a: a[0] += p[0]; a[1] += p[1]; a[2] += 1
                      else: pcs[pc] = [p[0], p[1], 1]
          with open("data/postcodes.tsv", "w", encoding="utf-8") as o:
              for pc in sorted(pcs, key=lambda x: x.replace(" ", "")):
                  a = pcs[pc]
                  o.write("%s\t%s\t%.5f\t%.5f\n" % (pc.replace(" ", "").lower(), pc, a[0] / a[2], a[1] / a[2]))
          print("addresses:", n, "postcodes:", len(pcs))
          PY
          rm -f data/addr.geojsonseq
          LC_ALL=C sort -S 4G -T data -t "$(printf '\t')" -k1,1 data/addr.unsorted | cut -f2- > data/addresses.tsv
          rm -f data/addr.unsorted
          ls -l data/addresses.tsv data/postcodes.tsv
      - name: Build street lamp and traffic light lists
        if: matrix.part == 'lists'
        run: |
          for kind in street_lamp:lamps traffic_signals:signals; do
            tag="${kind%%:*}"; out="${kind##*:}"
            osmium tags-filter data/region.osm.pbf "n/highway=$tag" -o "data/$out.osm.pbf" --overwrite
            osmium export "data/$out.osm.pbf" -f geojsonseq --geometry-types=point -o "data/$out.geojsonseq" --overwrite
            python3 - "$out" <<'PY'
          import json, math, sys
          name = sys.argv[1]; n = 0
          with open("data/%s.geojsonseq" % name, encoding="utf-8") as f, open("data/%s.unsorted" % name, "w") as o:
              for line in f:
                  line = line.lstrip("\x1e").strip()
                  if not line: continue
                  try: lon, lat = json.loads(line)["geometry"]["coordinates"]
                  except Exception: continue
                  x = min(32767, max(0, int((lon + 180.0) / 360.0 * 32768)))
                  r = math.radians(lat)
                  y = min(32767, max(0, int((1.0 - math.log(math.tan(r) + 1.0 / math.cos(r)) / math.pi) / 2.0 * 32768)))
                  o.write("%05d%05d\t%.6f\t%.6f\n" % (y, x, lat, lon)); n += 1
          print(name, n)
          PY
            LC_ALL=C sort -S 1G -T data "data/$out.unsorted" > "data/$out.tsv"
            rm -f "data/$out.unsorted" "data/$out.osm.pbf" "data/$out.geojsonseq"
          done
          ls -l data/lamps.tsv data/signals.tsv

      # ---------------- speed limits and speed cameras (full builds and "extras only") ----------------
      - name: Build speed limit and speed camera lists
        if: matrix.part == 'lists' || matrix.part == 'extras'
        run: |
          # speed cameras: the same tile-sorted list as the traffic lights
          osmium tags-filter data/region.osm.pbf "n/highway=speed_camera" -o data/cams.osm.pbf --overwrite
          osmium export data/cams.osm.pbf -f geojsonseq --geometry-types=point -o data/cams.geojsonseq --overwrite
          python3 - <<'PY'
          import json, math
          n = 0
          with open("data/cams.geojsonseq", encoding="utf-8") as f, open("data/cameras.unsorted", "w") as o:
              for line in f:
                  line = line.lstrip("\x1e").strip()
                  if not line: continue
                  try:
                      ft = json.loads(line); lon, lat = ft["geometry"]["coordinates"]
                  except Exception: continue
                  # which way the camera checks traffic, in degrees, when it's mapped (a 4th column; blank when not known)
                  pr = ft.get("properties") or {}
                  dv = str(pr.get("direction") or pr.get("camera:direction") or "").strip().upper()
                  card = {"N":0,"NNE":22.5,"NE":45,"ENE":67.5,"E":90,"ESE":112.5,"SE":135,"SSE":157.5,"S":180,"SSW":202.5,"SW":225,"WSW":247.5,"W":270,"WNW":292.5,"NW":315,"NNW":337.5}
                  d = ""
                  if dv and ";" not in dv:
                      if dv in card: d = "%g" % card[dv]
                      else:
                          try: d = "%g" % (float(dv) % 360.0)
                          except ValueError: d = ""
                  x = min(32767, max(0, int((lon + 180.0) / 360.0 * 32768)))
                  r = math.radians(lat)
                  y = min(32767, max(0, int((1.0 - math.log(math.tan(r) + 1.0 / math.cos(r)) / math.pi) / 2.0 * 32768)))
                  o.write("%05d%05d\t%.6f\t%.6f\t%s\n" % (y, x, lat, lon, d)); n += 1
          print("cameras", n)
          PY
          LC_ALL=C sort -S 1G -T data data/cameras.unsorted > data/cameras.tsv
          rm -f data/cameras.unsorted data/cams.osm.pbf data/cams.geojsonseq
          # every road a car can use, with its speed limit tags and shape, grouped by zoom-14 tile (see OfflineLimits.kt in the app)
          osmium tags-filter data/region.osm.pbf w/highway=motorway,motorway_link,trunk,trunk_link,primary,primary_link,secondary,secondary_link,tertiary,tertiary_link,unclassified,residential,living_street,service,road -o data/roads.osm.pbf --overwrite
          osmium export data/roads.osm.pbf -f geojsonseq --geometry-types=linestring --add-unique-id=type_id -o data/roads.geojsonseq --overwrite
          rm -f data/roads.osm.pbf
          python3 - <<'PY'
          import json, math, base64
          HW = ["motorway","motorway_link","trunk","trunk_link","primary","primary_link","secondary","secondary_link","tertiary","tertiary_link","unclassified","residential","living_street","service","road"]
          HI = {h: i for i, h in enumerate(HW)}
          Z = 16384
          def tile(lat, lon):
              x = min(Z - 1, max(0, int((lon + 180.0) / 360.0 * Z)))
              r = math.radians(max(-85.0, min(85.0, lat)))
              y = min(Z - 1, max(0, int((1.0 - math.log(math.tan(r) + 1.0 / math.cos(r)) / math.pi) / 2.0 * Z)))
              return y * Z + x
          def uv(n, out):
              while True:
                  b = n & 0x7f; n >>= 7
                  if n: out.append(b | 0x80)
                  else: out.append(b); return
          def zz(n): return (n << 1) ^ (n >> 63)
          def st(s, out):
              b = str(s or "").replace("\t", " ").encode("utf-8")[:255]
              uv(len(b), out); out.extend(b)
          n = 0
          with open("data/roads.geojsonseq", encoding="utf-8") as f, open("data/limits.unsorted", "w") as o:
              for line in f:
                  line = line.lstrip("\x1e").strip()
                  if not line: continue
                  try: ft = json.loads(line)
                  except Exception: continue
                  g = ft.get("geometry") or {}
                  if g.get("type") != "LineString": continue
                  pr = ft.get("properties") or {}
                  hw = pr.get("highway")
                  if hw not in HI: continue
                  # driveways and car park aisles are left out (they only get in the way of matching the road you're on)
                  if hw == "service" and pr.get("service") and not pr.get("maxspeed"): continue
                  c = g.get("coordinates") or []
                  if len(c) < 2: continue
                  fid = str(ft.get("id", "w0"))
                  wid = int(fid[1:]) if fid[1:].isdigit() else 0
                  ow = str(pr.get("oneway", "")).lower(); jn = str(pr.get("junction", "")).lower()
                  flags = (1 if ow in ("yes", "true", "1") else 0) | (2 if ow == "-1" else 0) | (4 if jn in ("roundabout", "circular") else 0)
                  mt = pr.get("maxspeed:type") or pr.get("source:maxspeed") or pr.get("zone:maxspeed") or ""
                  pts = [(int(round(p[1] * 1e5)), int(round(p[0] * 1e5))) for p in c]
                  dd = [pts[0]]
                  for q in pts[1:]:
                      if q != dd[-1]: dd.append(q)
                  if len(dd) < 2: continue
                  rec = bytearray([HI[hw], flags]); uv(wid, rec)
                  for s in (pr.get("name"), pr.get("ref"), pr.get("maxspeed"), mt, pr.get("maxspeed:forward"), pr.get("maxspeed:backward")): st(s, rec)
                  uv(len(dd), rec); uv(dd[0][0] + 9000000, rec); uv(dd[0][1] + 18000000, rec)
                  for i in range(1, len(dd)):
                      uv(zz(dd[i][0] - dd[i - 1][0]), rec); uv(zz(dd[i][1] - dd[i - 1][1]), rec)
                  keys = set()
                  for i in range(len(c) - 1):
                      a = c[i]; b = c[i + 1]
                      dy = (b[1] - a[1]) * 111320.0; dx = (b[0] - a[0]) * 111320.0 * math.cos(math.radians(a[1]))
                      steps = int(math.hypot(dx, dy) / 100.0) + 1
                      for k in range(steps + 1):
                          t = k / steps
                          keys.add(tile(a[1] + (b[1] - a[1]) * t, a[0] + (b[0] - a[0]) * t))
                  enc = base64.b64encode(bytes(rec)).decode()
                  for k in keys: o.write("%09d\t%s\n" % (k, enc))
                  n += 1
          print("roads", n)
          PY
          rm -f data/roads.geojsonseq
          LC_ALL=C sort -S 3G -T data data/limits.unsorted > data/limits.sorted
          rm -f data/limits.unsorted
          python3 - <<'PY'
          import base64, zlib, struct
          def uv(n, out):
              while True:
                  b = n & 0x7f; n >>= 7
                  if n: out.append(b | 0x80)
                  else: out.append(b); return
          idx = []; state = {"off": 0, "cur": None, "recs": []}
          def flush(o):
              if state["cur"] is None: return
              blob = bytearray(); uv(len(state["recs"]), blob)
              for r in state["recs"]: blob.extend(r)
              z = zlib.compress(bytes(blob), 9)
              o.write(z); idx.append((state["cur"], state["off"], len(z))); state["off"] += len(z)
          with open("data/limits.sorted") as f, open("data/limits.blobs", "wb") as o:
              for line in f:
                  k, _, e = line.rstrip("\n").partition("\t")
                  k = int(k)
                  if k != state["cur"]:
                      flush(o); state["cur"] = k; state["recs"] = []
                  state["recs"].append(base64.b64decode(e))
              flush(o)
          with open("data/limits.bin", "wb") as o:
              o.write(b"HNL1"); o.write(struct.pack(">II", 14, len(idx)))
              for k, of, ln in idx: o.write(struct.pack(">III", k, of, ln))
              with open("data/limits.blobs", "rb") as b:
                  while True:
                      ch = b.read(1 << 20)
                      if not ch: break
                      o.write(ch)
          print("tiles", len(idx))
          PY
          rm -f data/limits.sorted data/limits.blobs
          ls -l data/cameras.tsv data/limits.bin

      # ---------------- publish ----------------
      - name: Publish to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f data/region.osm.pbf data/tz.sqlite
          # GitHub refuses release files of 2 GB or more, so a bigger file is cut into parts (the app joins them again)
          for big in tiles.tar map.pmtiles addresses.tsv places.tsv names.idx; do
            if [ -f "data/$big" ] && [ "$(stat -c%s data/$big)" -gt 1900000000 ]; then
              split -b 1800M -d -a 2 "data/$big" "data/$big.part" && rm "data/$big"
            fi
          done
          FILES=""
          for f in data/tiles.tar data/tiles.tar.part* data/admins.sqlite data/valhalla.json data/places.tsv data/places.tsv.part* data/names.idx data/names.idx.part* data/map.pmtiles data/map.pmtiles.part* data/fonts.zip data/addresses.tsv data/addresses.tsv.part* data/postcodes.tsv data/lamps.tsv data/signals.tsv data/cameras.tsv data/limits.bin; do
            # GitHub won't take an empty file (an area with no traffic lights mapped, say): the app copes without it
            [ -s "$f" ] && FILES="$FILES $f"
          done
          [ -n "$FILES" ] || { echo "Nothing to publish"; exit 1; }
          # (in "extras only" mode just the speed limit and camera files are here: the rest of the release is left as it is)
          ls -l $FILES
          gh release upload "${{ matrix.area.tag }}" $FILES --repo "${{ github.repository }}" --clobber
          echo "Download address: https://github.com/${{ github.repository }}/releases/download/${{ matrix.area.tag }}"
