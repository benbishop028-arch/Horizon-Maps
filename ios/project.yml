name: HorizonNav
options:
  bundleIdPrefix: com.horizonnav
  deploymentTarget:
    iOS: "17.0"
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.31.0
  ValhallaMobile:
    url: https://github.com/Rallista/valhalla-mobile
    exactVersion: 0.6.4
settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  HorizonNav:
    type: application
    platform: iOS
    sources:
      - path: HorizonNav
    dependencies:
      - package: MapLibre
        product: MapLibre
      - package: ValhallaMobile
        product: Valhalla
    configFiles:
      Debug: Config/HorizonNav.xcconfig
      Release: Config/HorizonNav.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.horizonnav.ios
        INFOPLIST_FILE: HorizonNav/Info.plist
        CODE_SIGN_ENTITLEMENTS: HorizonNav/HorizonNav.entitlements
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - HorizonNavTests
  HorizonNavTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HorizonNavTests
    dependencies:
      - target: HorizonNav
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.horizonnav.ios.tests
        GENERATE_INFOPLIST_FILE: YES
