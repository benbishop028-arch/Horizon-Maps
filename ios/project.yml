name: HorizonNav
options:
  bundleIdPrefix: com.horizonnav
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  HorizonNav:
    type: application
    platform: iOS
    sources:
      - path: HorizonNav
    configFiles:
      Debug: Config/HorizonNav.xcconfig
      Release: Config/HorizonNav.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.horizonnav.ios
        INFOPLIST_FILE: HorizonNav/Info.plist
        CODE_SIGN_ENTITLEMENTS: HorizonNav/HorizonNav.entitlements
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - HorizonNavTests
  HorizonNavTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HorizonNavTests
    dependencies:
      - target: HorizonNav
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.horizonnav.ios.tests
        GENERATE_INFOPLIST_FILE: YES
